services:
  # Initial setup services - uncomment to bootstrap configuration
  # apache-init:
  #   build:
  #     context: ./apache
  #     dockerfile: Dockerfile
  #   container_name: apache-init
  #   command: >
  #     bash -c "
  #       mkdir -p /mnt/conf /mnt/htdocs &&
  #       cp -r /usr/local/apache2/conf/* /mnt/conf 2>/dev/null || true &&
  #       cp -r /usr/local/apache2/htdocs/* /mnt/htdocs 2>/dev/null || true"
  #   volumes:
  #     - ~/docker-volumes/apache-stack/conf:/mnt/conf
  #     - ~/docker-volumes/apache-stack/htdocs:/mnt/htdocs
  #   entrypoint: ""

  # php-init:
  #   build:
  #     context: ./php
  #     dockerfile: Dockerfile
  #   container_name: php-init
  #   command: >
  #     bash -c "
  #       mkdir -p /mnt/php-conf &&
  #       cp /usr/local/etc/php/php.ini-production /mnt/php-conf/php.ini 2>/dev/null || true"
  #   volumes:
  #     - ~/docker-volumes/apache-stack/php:/mnt/php-conf
  #   entrypoint: ""

  apache:
    build:
      context: ./apache
      dockerfile: Dockerfile
    container_name: apache
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ~/docker-volumes/apache-stack/conf:/usr/local/apache2/conf
      - ~/docker-volumes/apache-stack/htdocs:/usr/local/apache2/htdocs
      - ~/docker-volumes/apache-stack/var:/usr/local/apache2/var
      - ~/docker-volumes/apache-stack/uploads:/usr/local/apache2/uploads
      - ~/docker-volumes/apache-stack/user.passwd:/usr/local/apache2/user.passwd
      - ~/docker-volumes/apache-stack/python-apps:/usr/local/apache2/python-apps
      - svn_repos:/usr/local/apache2/svn
      - git_repos:/usr/local/apache2/git
    restart: unless-stopped
    networks:
      - apache-network
    depends_on:
      - php

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php-fpm
    volumes:
    # Match Apache's path exactly
      - ~/docker-volumes/apache-stack/htdocs:/usr/local/apache2/htdocs  
      - ~/docker-volumes/apache-stack/php/php.ini:/usr/local/etc/php/php.ini
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - apache-network

  mysql:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - apache-network

networks:
  apache-network:
    driver: bridge

# Add this volumes section
volumes:
  svn_repos:
  git_repos:
  mysql_data: