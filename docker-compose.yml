  apache:
    build:
      context: ./apache
      dockerfile: Dockerfile
    container_name: apache
    # depends_on:
    #   - apache-init
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ~/docker-volumes/apache-stack/conf:/usr/local/apache2/conf
      - ~/docker-volumes/apache-stack/htdocs:/usr/local/apache2/htdocs
      - ~/docker-volumes/apache-stack/var:/usr/local/apache2/var
      - ~/docker-volumes/apache-stack/uploads:/usr/local/apache2/uploads
      - ~/docker-volumes/apache-stack/user.passwd:/usr/local/apache2/user.passwd
    restart: unless-stopped
