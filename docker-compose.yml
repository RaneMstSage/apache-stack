services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    environment:
      - TZ=America/New_York
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      # - ${DOCKER_VOLUMES_BASE}/nginx/stream.conf:/etc/nginx/stream.conf:rw
      - ${DOCKER_VOLUMES_BASE}/nginx/conf.d:/etc/nginx/conf.d:rw
      - ${DOCKER_VOLUMES_BASE}/nginx/nginx.conf:/etc/nginx/nginx.conf:rw
      - ${DOCKER_VOLUMES_BASE}/nginx/ssl:/etc/nginx/ssl:rw
      - ${DOCKER_VOLUMES_BASE}/nginx/logs:/var/log/nginx
      # Static files cache directory
      - ${DOCKER_VOLUMES_BASE}/nginx/cache:/var/cache/nginx
      # Certbot-related volumes for Let's Encrypt - allow nginx to read certificates
      - ${DOCKER_VOLUMES_BASE}/certbot/conf:/etc/letsencrypt:ro
      - ${DOCKER_VOLUMES_BASE}/certbot/www:/var/www/certbot:ro
      - ${DOCKER_VOLUMES_BASE}/nginx/502.html:/etc/nginx/502.html:ro
    networks:
      - apache-network
    depends_on:
      - apache1
      - apache2
      - apache3
      - redmine
      - php
    restart: unless-stopped
    # Add healthcheck for more robust operation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
       - "${SEARXNG_HTTP_PORT}:8080"
    environment:
      - TZ=America/New_York
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    volumes:
      - ${DOCKER_VOLUMES_BASE}/searxng/settings:/etc/searxng
      - ${DOCKER_VOLUMES_BASE}/searxng/data:/var/lib/searxng
      - ${DOCKER_VOLUMES_BASE}/searxng/limiter.toml:/etc/searxng/limiter.toml
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    networks: [apache-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: searxng-redis
    environment:
      - TZ=America/New_York
    restart: unless-stopped
    networks:
      - apache-network

  apache1:
    image: ranemstsage/apache-stack-apache:latest
    container_name: apache1
    environment:
      - TZ=America/New_York
    # ports:
    #    - "${APACHE_HTTP_PORT}:80"
    #    - "${APACHE_HTTPS_PORT}:443"
    volumes:
      - ${DOCKER_VOLUMES_BASE}/conf:/usr/local/apache2/conf
      - ${DOCKER_VOLUMES_BASE}/htdocs:/usr/local/apache2/htdocs
      - ${DOCKER_VOLUMES_BASE}/var:/usr/local/apache2/var
      - ${DOCKER_VOLUMES_BASE}/uploads:/usr/local/apache2/uploads
      - ${DOCKER_VOLUMES_BASE}/user.passwd:/usr/local/apache2/user.passwd
      - ${DOCKER_VOLUMES_BASE}/python-apps:/usr/local/apache2/python-apps
      # - svn_repos:/usr/local/apache2/svn
      # - git_repos:/usr/local/apache2/git
      - ${WSL_SVN_REPOS_PATH}:/usr/local/apache2/svn
      - ${WSL_GIT_REPOS_PATH}:/usr/local/apache2/git
      - ${WSL_GIT_LFS_PATH}:/usr/local/apache2/git-lfs-storage
    restart: unless-stopped
    networks:
      - apache-network
    depends_on:
      - php
    # Add healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/server-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  apache2:
    image: ranemstsage/apache-stack-apache:latest
    container_name: apache2
    environment:
      - TZ=America/New_York
    # ports:
    #    - "${APACHE_HTTP_PORT}:80"
    #    - "${APACHE_HTTPS_PORT}:443"
    volumes:
      - ${DOCKER_VOLUMES_BASE}/conf:/usr/local/apache2/conf
      - ${DOCKER_VOLUMES_BASE}/htdocs:/usr/local/apache2/htdocs
      - ${DOCKER_VOLUMES_BASE}/var:/usr/local/apache2/var
      - ${DOCKER_VOLUMES_BASE}/uploads:/usr/local/apache2/uploads
      - ${DOCKER_VOLUMES_BASE}/user.passwd:/usr/local/apache2/user.passwd
      - ${DOCKER_VOLUMES_BASE}/python-apps:/usr/local/apache2/python-apps
      # - svn_repos:/usr/local/apache2/svn
      # - git_repos:/usr/local/apache2/git
      - ${WSL_SVN_REPOS_PATH}:/usr/local/apache2/svn
      - ${WSL_GIT_REPOS_PATH}:/usr/local/apache2/git
      - ${WSL_GIT_LFS_PATH}:/usr/local/apache2/git-lfs-storage
    restart: unless-stopped
    networks:
      - apache-network
    depends_on:
      - php
    # Add healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/server-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  apache3:
    image: ranemstsage/apache-stack-apache:latest
    container_name: apache3
    environment:
      - TZ=America/New_York
    # ports:
    #    - "${APACHE_HTTP_PORT}:80"
    #    - "${APACHE_HTTPS_PORT}:443"
    volumes:
      - ${DOCKER_VOLUMES_BASE}/conf:/usr/local/apache2/conf
      - ${DOCKER_VOLUMES_BASE}/htdocs:/usr/local/apache2/htdocs
      - ${DOCKER_VOLUMES_BASE}/var:/usr/local/apache2/var
      - ${DOCKER_VOLUMES_BASE}/uploads:/usr/local/apache2/uploads
      - ${DOCKER_VOLUMES_BASE}/user.passwd:/usr/local/apache2/user.passwd
      - ${DOCKER_VOLUMES_BASE}/python-apps:/usr/local/apache2/python-apps
      # - svn_repos:/usr/local/apache2/svn
      # - git_repos:/usr/local/apache2/git
      - ${WSL_SVN_REPOS_PATH}:/usr/local/apache2/svn
      - ${WSL_GIT_REPOS_PATH}:/usr/local/apache2/git
      - ${WSL_GIT_LFS_PATH}:/usr/local/apache2/git-lfs-storage
    restart: unless-stopped
    networks:
      - apache-network
    depends_on:
      - php
    # Add healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/server-status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    image: ranemstsage/apache-stack-php:latest
    container_name: php-fpm
    environment:
      - TZ=America/New_York
    volumes:
      # Match Apache's path exactly
      - ${DOCKER_VOLUMES_BASE}/htdocs:/usr/local/apache2/htdocs  
      - ${DOCKER_VOLUMES_BASE}/php/php.ini:/usr/local/etc/php/php.ini
      - ${DOCKER_VOLUMES_BASE}/uploads:/usr/local/apache2/uploads
    expose:
      - "9000"
    restart: unless-stopped
    networks:
      - apache-network
    # Add healthcheck for PHP-FPM
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    container_name: mysql
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - TZ=America/New_York
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${REDMINE_DB_DATABASE}
      - MYSQL_USER=${REDMINE_DB_USERNAME}
      - MYSQL_PASSWORD=${REDMINE_DB_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - apache-network
    restart: unless-stopped
    # Add healthcheck for MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redmine:
    container_name: redmine
    image: ranemstsage/apache-stack-redmine:latest
    restart: always
    ports:
      - "${REDMINE_PORT}:3000"
    environment:
      - TZ=America/New_York
      - REDMINE_DB_MYSQL=mysql
      - REDMINE_DB_DATABASE=${REDMINE_DB_DATABASE}
      - REDMINE_DB_USERNAME=${REDMINE_DB_USERNAME}
      - REDMINE_DB_PASSWORD=${REDMINE_DB_PASSWORD}
      - REDMINE_SECRET_KEY_BASE=${REDMINE_SECRET_KEY_BASE}
    volumes:
      - ${DOCKER_VOLUMES_BASE}/redmine/files:/usr/src/redmine/files
      - ${DOCKER_VOLUMES_BASE}/redmine/plugins:/usr/src/redmine/plugins
      - ${DOCKER_VOLUMES_BASE}/redmine/config:/usr/src/redmine/config
      - ${DOCKER_VOLUMES_BASE}/redmine/themes:/usr/src/redmine/themes
      # - svn_repos:/usr/src/redmine/svn
      # - git_repos:/usr/src/redmine/git
      - ${WSL_SVN_REPOS_PATH}:/usr/src/redmine/svn
      - ${WSL_GIT_REPOS_PATH}:/usr/src/redmine/git
    networks:
      - apache-network
    depends_on:
      - mysql
    command: ["rails", "server", "-e", "production", "-p", "3000", "-b", "0.0.0.0"]
    # Add healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 240s

  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    ports:
      - "${LDAP_PORT}:389"
      - "${LDAPS_PORT}:636"
    environment:
      - TZ=America/New_York
      - LDAP_ORGANISATION=${LDAP_ORGANISATION}
      - LDAP_DOMAIN=${LDAP_DOMAIN}
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - apache-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=mstsage,dc=com", "-D", "cn=admin,dc=mstsage,dc=com", "-w", "${LDAP_ADMIN_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  ssh-router:
    image: ranemstsage/apache-stack-ssh-router:latest
    container_name: ssh-router
    ports:
      - "2222:22"  # Takes over external SSH port
    environment:
      - TZ=America/New_York
      # Admin access
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - WINDOWS_SSH_HOST=${WINDOWS_SSH_HOST}
      - WINDOWS_SSH_PORT=${WINDOWS_SSH_PORT}
      # Remove this line: - WINDOWS_USERNAME=${WINDOWS_USERNAME}
      - GIT_USERNAME=${GIT_USERNAME}
      - SVN_USERNAME=${SVN_USERNAME}
      # Repository paths
      - GIT_REPOS_PATH=/opt/repositories/git
      - SVN_REPOS_PATH=/opt/repositories/svn
      # LDAP configuration
      - LDAP_HOST=${LDAP_HOST}
      - LDAP_PORT=${LDAP_PORT}
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${REDMINE_DB_DATABASE}
      - MYSQL_USER=${REDMINE_DB_USERNAME}
      - MYSQL_PASSWORD=${REDMINE_DB_PASSWORD}
      - USE_DATABASE_AUTH=true
    volumes:
      # SSH keys directory
      - ${DOCKER_VOLUMES_BASE}/ssh-router/keys:/etc/ssh/keys:rw
      # Repository access configuration - FIX THIS LINE
      - ${DOCKER_VOLUMES_BASE}/ssh-router/repo-access.conf:/opt/config/repo-access.conf:ro
      # Git repositories
      - ${WSL_GIT_REPOS_PATH}:/opt/repositories/git:rw
      - ${WSL_GIT_LFS_PATH}:/usr/local/git-lfs-storage
      # SVN repositories
      - ${WSL_SVN_REPOS_PATH}:/opt/repositories/svn:rw
    networks:
      - apache-network
    depends_on:
      - mysql 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Certbot service for SSL certificate management - Updated based on Let's Encrypt with Docker best practices
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    environment:
      - TZ=America/New_York
    volumes:
      # These need to be writable by certbot
      - ${DOCKER_VOLUMES_BASE}/certbot/conf:/etc/letsencrypt:rw
      - ${DOCKER_VOLUMES_BASE}/certbot/www:/var/www/certbot:rw
      - ${DOCKER_VOLUMES_BASE}/certbot/logs:/var/log/letsencrypt:rw
    networks:
      - apache-network
    # Use 'certonly' command with webroot authentication
    # This is more reliable than the auto-renewal script
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    # Add dependency on nginx since we're using webroot authentication
    depends_on:
      - nginx
    restart: unless-stopped

  # Git LFS Server
  giftless:
    build: ./giftless  # Add this line
    # image: datopian/giftless:latest  # Comment out or remove this line
    container_name: giftless
    environment:
      - TZ=America/New_York
      - GIFTLESS_CONFIG_FILE=/etc/giftless.yaml
    ports:
      - "5000:5000"
    volumes:
      - ${DOCKER_VOLUMES_BASE}/giftless/config.yaml:/etc/giftless.yaml:ro
      - ${DOCKER_VOLUMES_BASE}/giftless/apache_proxy.py:/app/giftless/auth/apache_proxy.py:ro
      - ${WSL_GIT_LFS_PATH}:/data/lfs-storage
    networks:
      - apache-network
    restart: unless-stopped
    command: >
      -M -T --threads 2 -p 2 --manage-script-name --callable app
      --http 0.0.0.0:5000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  apache-network:
    driver: bridge

volumes:
  # svn_repos:
  # git_repos:
  mysql_data:
  ldap_data:
  ldap_config: