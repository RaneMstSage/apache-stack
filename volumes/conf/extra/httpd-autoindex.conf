# ============================================
# Apache AutoIndex Module Configuration
# ============================================
# Directives controlling the display of server-generated directory listings
#
# Required modules: mod_authz_core, mod_authz_host,
#                   mod_autoindex, mod_alias
#
# To see the listing of a directory, the Options directive for the
# directory must include "Indexes", and the directory must not contain
# a file matching those listed in the DirectoryIndex directive.

# ============================================
# Index Display Options
# ============================================
# Controls the appearance of server-generated directory listings
# FancyIndexing: Enables table format with file icons
# HTMLTable: Uses HTML tables for better alignment
# VersionSort: Sorts versioned files naturally (e.g., file-1.10 after file-1.9)
IndexOptions FancyIndexing HTMLTable VersionSort

# ============================================
# Icons Directory Alias
# ============================================
# We include the /icons/ alias for FancyIndexed directory listings
# If you do not use FancyIndexing, you may comment this out
Alias /icons/ "/usr/local/apache2/icons/"

<Directory "/usr/local/apache2/icons">
    # Allow indexes and content negotiation for icon files
    Options Indexes MultiViews
    
    # No .htaccess overrides in icons directory
    AllowOverride None
    
    # Allow access to all users
    Require all granted
</Directory>

# ============================================
# Icon Assignments by Encoding
# ============================================
# Show specific icons for compressed files based on encoding
AddIconByEncoding (CMP,/icons/compressed.gif) x-compress x-gzip

# ============================================
# Icon Assignments by MIME Type
# ============================================
# Show specific icons based on file MIME types
AddIconByType (TXT,/icons/text.gif) text/*
AddIconByType (IMG,/icons/image2.gif) image/*
AddIconByType (SND,/icons/sound2.gif) audio/*
AddIconByType (VID,/icons/movie.gif) video/*

# ============================================
# Icon Assignments by File Extension
# ============================================
# Show specific icons for files based on their extensions
# Binary and executable files
AddIcon /icons/binary.gif .bin .exe
AddIcon /icons/binhex.gif .hqx

# Archive files
AddIcon /icons/tar.gif .tar
AddIcon /icons/compressed.gif .Z .z .tgz .gz .zip

# 3D and VRML files
AddIcon /icons/world2.gif .wrl .wrl.gz .vrml .vrm .iv

# Document formats
AddIcon /icons/a.gif .ps .ai .eps
AddIcon /icons/layout.gif .html .shtml .htm .pdf
AddIcon /icons/text.gif .txt
AddIcon /icons/dvi.gif .dvi
AddIcon /icons/tex.gif .tex

# Programming languages
AddIcon /icons/c.gif .c
AddIcon /icons/p.gif .pl .py
AddIcon /icons/f.gif .for
AddIcon /icons/script.gif .conf .sh .shar .csh .ksh .tcl

# Special files
AddIcon /icons/uuencoded.gif .uu
AddIcon /icons/bomb.gif core

# Navigation icons
AddIcon /icons/back.gif ..
AddIcon /icons/hand.right.gif README
AddIcon /icons/folder.gif ^^DIRECTORY^^
AddIcon /icons/blank.gif ^^BLANKICON^^

# ============================================
# Default Icon
# ============================================
# Icon to show for files which do not have an icon explicitly set
DefaultIcon /icons/unknown.gif

# ============================================
# File Descriptions
# ============================================
# Add descriptions after files in server-generated indexes
# Only displayed for FancyIndexed directories
# Format: AddDescription "description" filename
#
# Examples:
#AddDescription "GZIP compressed document" .gz
#AddDescription "tar archive" .tar
#AddDescription "GZIP compressed tar archive" .tgz

# ============================================
# Header and Footer Files
# ============================================
# ReadmeName: File to append to directory listings (footer)
ReadmeName README.html

# HeaderName: File to prepend to directory listings (header)
HeaderName HEADER.html

# ============================================
# Files to Ignore
# ============================================
# IndexIgnore: Filenames which directory indexing should ignore
# Shell-style wildcarding is permitted
# Common patterns:
# .??* - Hidden files starting with dot
# *~ - Backup files
# *# - Emacs auto-save files
# HEADER* - Header files
# README* - Readme files
# RCS CVS - Version control directories
# *,v *,t - RCS/CVS files
IndexIgnore .??* *~ *# HEADER* README* RCS CVS *,v *,t

# ============================================
# End of AutoIndex Configuration
# ============================================