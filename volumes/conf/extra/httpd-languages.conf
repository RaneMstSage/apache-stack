# ============================================
# Apache Language and Character Set Configuration
# ============================================
# Settings for hosting different languages and content negotiation
#
# Required modules: mod_mime, mod_negotiation

# ============================================
# Default Language Setting
# ============================================
# Specify a default language for all content without explicit language tags
# WARNING: It's generally better to NOT set this unless you're certain
# all your content is in one language. Mislabeling content language
# is worse than not labeling it at all.
#
# [UNCOMMENT and CHANGE if all your content is in one language]
# DefaultLanguage en

# ============================================
# Language to File Extension Mappings
# ============================================
# Associates language codes with file extensions for content negotiation
# This allows serving the appropriate language version based on browser preferences
#
# Format: AddLanguage language-code .extension
#
# Note 1: The suffix doesn't have to match the language code
#         Example: Polish (pl) can use .po to avoid confusion with Perl scripts
#
# Note 2: Language codes sometimes differ from country codes
#         Example: Denmark (dk) vs Danish (da)
#
# Note 3: 'ltz' uses three characters instead of standard two (RFC violation)
#         This is being addressed in RFC1766 updates

# ----------------------------------------
# European Languages
# ----------------------------------------
AddLanguage ca .ca              # Catalan
AddLanguage cs .cz .cs          # Czech
AddLanguage da .dk              # Danish
AddLanguage de .de              # German
AddLanguage el .el              # Greek (Modern)
AddLanguage en .en              # English
AddLanguage eo .eo              # Esperanto
AddLanguage es .es              # Spanish
AddLanguage et .et              # Estonian
AddLanguage fr .fr              # French
AddLanguage hr .hr              # Croatian
AddLanguage it .it              # Italian
AddLanguage ltz .ltz            # Luxembourgish
AddLanguage nl .nl              # Dutch
AddLanguage nn .nn              # Norwegian Nynorsk
AddLanguage no .no              # Norwegian
AddLanguage pl .po              # Polish
AddLanguage pt .pt              # Portuguese
AddLanguage pt-BR .pt-br        # Portuguese (Brazilian)
AddLanguage ru .ru              # Russian
AddLanguage sv .sv              # Swedish
AddLanguage tr .tr              # Turkish

# ----------------------------------------
# Asian Languages
# ----------------------------------------
AddLanguage he .he              # Hebrew
AddLanguage ja .ja              # Japanese
AddLanguage ko .ko              # Korean
AddLanguage zh-CN .zh-cn        # Chinese (Simplified)
AddLanguage zh-TW .zh-tw        # Chinese (Traditional)

# ============================================
# Language Priority Configuration
# ============================================
# Sets precedence when multiple language versions exist and
# browser preferences result in a tie during content negotiation
#
# Listed in decreasing order of preference
# [CHANGE: Reorder based on your site's primary audiences]
LanguagePriority en ca cs da de el eo es et fr he hr it ja ko ltz nl nn no pl pt pt-BR ru sv tr zh-CN zh-TW

# ============================================
# Language Priority Enforcement
# ============================================
# Determines behavior when no exact language match is found
#
# Prefer: Serve the best match from LanguagePriority (avoid "Multiple Choices" error)
# Fallback: Serve something rather than "Not Acceptable" error
ForceLanguagePriority Prefer Fallback

# ============================================
# Character Set Definitions
# ============================================
# Maps file extensions to character encodings
# Be careful to avoid conflicts with language extensions
# See http://www.iana.org/assignments/character-sets for official list

# ----------------------------------------
# ASCII and ISO-8859 Family
# ----------------------------------------
AddCharset us-ascii.ascii .us-ascii
AddCharset ISO-8859-1  .iso8859-1  .latin1       # Western European
AddCharset ISO-8859-2  .iso8859-2  .latin2 .cen  # Central European
AddCharset ISO-8859-3  .iso8859-3  .latin3       # South European
AddCharset ISO-8859-4  .iso8859-4  .latin4       # North European
AddCharset ISO-8859-5  .iso8859-5  .cyr .iso-ru  # Cyrillic
AddCharset ISO-8859-6  .iso8859-6  .arb .arabic  # Arabic
AddCharset ISO-8859-7  .iso8859-7  .grk .greek   # Greek
AddCharset ISO-8859-8  .iso8859-8  .heb .hebrew  # Hebrew
AddCharset ISO-8859-9  .iso8859-9  .latin5 .trk  # Turkish
AddCharset ISO-8859-10  .iso8859-10  .latin6     # Nordic
AddCharset ISO-8859-13  .iso8859-13              # Baltic
AddCharset ISO-8859-14  .iso8859-14  .latin8     # Celtic
AddCharset ISO-8859-15  .iso8859-15  .latin9     # Western European with Euro
AddCharset ISO-8859-16  .iso8859-16  .latin10    # South-Eastern European

# ----------------------------------------
# ISO-2022 Family (Asian languages)
# ----------------------------------------
AddCharset ISO-2022-JP .iso2022-jp .jis          # Japanese
AddCharset ISO-2022-KR .iso2022-kr .kis          # Korean
AddCharset ISO-2022-CN .iso2022-cn .cis          # Chinese

# ----------------------------------------
# Asian Character Sets
# ----------------------------------------
AddCharset Big5.Big5   .big5 .b5                 # Traditional Chinese (Taiwan)
AddCharset cn-Big5 .cn-big5                      # Traditional Chinese variant
AddCharset gb2312  .gb2312 .gb                   # Simplified Chinese
AddCharset euc-cn  .euc-cn                       # Extended Unix Code - Chinese
AddCharset euc-gb  .euc-gb                       # Extended Unix Code - GB
AddCharset euc-jp  .euc-jp                       # Extended Unix Code - Japanese
AddCharset euc-kr  .euc-kr                       # Extended Unix Code - Korean
AddCharset EUC-TW  .euc-tw                       # Extended Unix Code - Taiwan
AddCharset shift_jis   .shift_jis .sjis          # Shift JIS (Japanese)

# ----------------------------------------
# Russian/Cyrillic Character Sets
# ----------------------------------------
# Multiple charsets used depending on client platform
AddCharset WINDOWS-1251 .cp-1251   .win-1251     # Windows Cyrillic
AddCharset CP866   .cp866                        # DOS Cyrillic
AddCharset KOI8  .koi8                          # KOI8 base
AddCharset KOI8-E  .koi8-e                      # KOI8 Extended
AddCharset KOI8-r  .koi8-r .koi8-ru             # KOI8 Russian
AddCharset KOI8-U  .koi8-u                      # KOI8 Ukrainian
AddCharset KOI8-ru .koi8-uk .ua                 # KOI8 Russian/Ukrainian

# ----------------------------------------
# Unicode Character Sets
# ----------------------------------------
# Modern character sets supporting multiple languages
AddCharset ISO-10646-UCS-2 .ucs2                # Unicode (16-bit)
AddCharset ISO-10646-UCS-4 .ucs4                # Unicode (32-bit)
AddCharset UTF-7   .utf7                         # Unicode (7-bit encoding)
AddCharset UTF-8   .utf8                         # Unicode (8-bit encoding) - RECOMMENDED
AddCharset UTF-16  .utf16                        # Unicode (16-bit encoding)
AddCharset UTF-16BE .utf16be                     # Unicode (16-bit big-endian)
AddCharset UTF-16LE .utf16le                     # Unicode (16-bit little-endian)
AddCharset UTF-32  .utf32                        # Unicode (32-bit encoding)
AddCharset UTF-32BE .utf32be                     # Unicode (32-bit big-endian)
AddCharset UTF-32LE .utf32le                     # Unicode (32-bit little-endian)

# Legacy Unicode aliases
AddCharset iso-10646-ucs-2 .ucs-2 .iso-10646-ucs-2
AddCharset iso-10646-ucs-4 .ucs-4 .iso-10646-ucs-4

# ============================================
# Usage Examples
# ============================================
# 1. Content Negotiation:
#    If you have index.html.en and index.html.fr, Apache
#    will serve the appropriate version based on browser language
#
# 2. Explicit Language URLs:
#    /docs/manual.en.html - English version
#    /docs/manual.de.html - German version
#
# 3. Character Set Headers:
#    Files ending in .utf8 will be served with
#    Content-Type: text/html; charset=UTF-8

# ============================================
# Best Practices
# ============================================
# 1. Use UTF-8 for new content (most universal)
# 2. Name files consistently: filename.lang.ext
# 3. Provide a default version without language suffix
# 4. Test with browsers set to different languages
# 5. Consider using HTTP Accept-Language header detection
# ============================================