# ============================================
# Apache Virtual Hosts Configuration
# ============================================
# Defines virtual hosts for name-based hosting
# This configuration works behind Nginx reverse proxy
#
# Required modules: mod_alias, mod_log_config, mod_headers,
#                   mod_remoteip (for proxy trust)

# ============================================
# Initial Setup Options
# ============================================
# For testing without a domain name, you can:
# 1. Use ServerName localhost
# 2. Use your server's IP address
# 3. Use a test domain in /etc/hosts
# 4. Comment out ServerName to accept any hostname
#
# With Docker/Nginx setup:
# - Nginx handles external domain names
# - Apache can use simple ServerName localhost
# - Nginx proxy_pass to http://apache1:80

# ============================================
# Primary Virtual Host
# ============================================
# Main website configuration
# For initial setup, this can be your only virtual host

# Default Virtual Host (catches all requests)
# Change to specific IP (*:80 -> 192.168.1.100:80) if needed
<VirtualHost *:80>
    # ----------------------------------------
    # Server Identity
    # ----------------------------------------
    # [CHANGE: Update to your domain name]
    ServerName localhost
    # For production use:
    # ServerName yourdomain.com
    # ServerAlias www.yourdomain.com
    
    # [CHANGE: Update admin email]
    ServerAdmin admin@localhost
    # For production use:
    # ServerAdmin webmaster@yourdomain.com
    
    DocumentRoot "/usr/local/apache2/htdocs"
    
    # ----------------------------------------
    # Document Root Configuration
    # ----------------------------------------
    <Directory "/usr/local/apache2/htdocs">
        # Allow directory listings and symbolic links
        Options Indexes FollowSymLinks
        
        # Allow .htaccess to override any setting
        AllowOverride All
        
        # Grant access to all users
        Require all granted
    </Directory>
    
    # ----------------------------------------
    # Reverse Proxy Trust Configuration
    # ----------------------------------------
    # Trust X-Forwarded-* headers from Nginx proxy
    # This ensures we get the real client IP, not Nginx IP
    RemoteIPHeader X-Forwarded-For
    
    # [OPTIONAL: Restrict trusted proxy IPs]
    # RemoteIPInternalProxy 172.16.0.0/12
    # RemoteIPInternalProxy 127.0.0.1
    
    # Set protocol based on Nginx headers
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    
    # ----------------------------------------
    # Logging Configuration
    # ----------------------------------------
    # Custom log format to capture real client IP from Nginx
    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" forwarded
    
    # Access log with real client IPs
    CustomLog "logs/access_log" forwarded
    
    # Error log for this virtual host
    ErrorLog "logs/error_log"
    
    # [OPTIONAL: Set log level]
    # LogLevel warn
</VirtualHost>

# ============================================
# Additional Virtual Hosts (Examples)
# ============================================
# [OPTIONAL: Uncomment and modify as needed]

# Example: Domain-specific Virtual Host
# <VirtualHost *:80>
#     ServerName example.com
#     ServerAlias www.example.com
#     DocumentRoot "/usr/local/apache2/htdocs/example"
#     
#     <Directory "/usr/local/apache2/htdocs/example">
#         Options Indexes FollowSymLinks
#         AllowOverride All
#         Require all granted
#     </Directory>
#     
#     RemoteIPHeader X-Forwarded-For
#     CustomLog "logs/example-access_log" forwarded
#     ErrorLog "logs/example-error_log"
# </VirtualHost>

# ============================================
# Global Virtual Host Settings
# ============================================
# Settings that apply to all virtual hosts

# Server signature off for security
ServerSignature Off

# Prevent clickjacking
Header always append X-Frame-Options SAMEORIGIN

# Prevent MIME type sniffing
Header set X-Content-Type-Options "nosniff"

# ============================================
# SSL Redirect (Handled by Nginx)
# ============================================
# Note: HTTPS redirects are handled by Nginx
# Apache only receives HTTP traffic on port 80
# from Nginx on the internal Docker network

# ============================================
# Load Balancer Considerations
# ============================================
# With 3 Apache instances behind Nginx:
# 1. All instances should have identical vhost configs
# 2. Logs will be distributed across instances
# 3. Session persistence handled by Nginx ip_hash
# 4. File uploads should go to shared storage

# ============================================
# Quick Testing
# ============================================
# 1. Create a test file:
#    echo "<?php phpinfo(); ?>" > /usr/local/apache2/htdocs/info.php
#
# 2. Test access:
#    curl http://localhost/info.php
#    curl -H "Host: localhost" http://localhost/info.php
#
# 3. Check virtual host configuration:
#    httpd -S

# ============================================
# Troubleshooting Virtual Hosts
# ============================================
# 1. Test configuration:
#    httpd -S
#
# 2. Test without domain name:
#    curl http://localhost
#    curl http://your-server-ip
#
# 3. Check if mod_remoteip is loaded:
#    httpd -M | grep remoteip
#
# 4. Debug real IP detection:
#    tail -f logs/access_log
#
# 5. Common issues:
#    - 403 errors: Check Directory permissions
#    - Missing real IP: Load mod_remoteip in httpd.conf
#    - Wrong document root: Verify path exists
# ============================================