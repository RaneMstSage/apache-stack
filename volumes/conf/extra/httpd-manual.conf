# ============================================
# Apache Documentation Configuration
# ============================================
# Provides access to the Apache documentation on your server
# Access at: http://yourserver.example.com/manual/
# Online version always available at: http://httpd.apache.org/docs/2.4/
#
# Required modules: mod_alias, mod_authz_core, mod_authz_host,
#                   mod_setenvif, mod_negotiation

# ============================================
# Documentation URL Mapping
# ============================================
# Maps /manual/ URLs to the Apache documentation directory
# Supports language-specific paths for internationalization
#
# Pattern matches:
# /manual/ -> /usr/local/apache2/manual/
# /manual/en/ -> /usr/local/apache2/manual/
# /manual/de/mod/core.html -> /usr/local/apache2/manual/mod/core.html
#
# Supported languages: da, de, en, es, fr, ja, ko, pt-br, ru, tr, zh-cn
AliasMatch ^/manual(?:/(?:da|de|en|es|fr|ja|ko|pt-br|ru|tr|zh-cn))?(/.*)?$ "/usr/local/apache2/manual$1"

# ============================================
# Documentation Directory Configuration
# ============================================
<Directory "/usr/local/apache2/manual">
    # Allow directory listings to browse documentation
    Options Indexes
    
    # No .htaccess overrides in documentation
    AllowOverride None
    
    # Allow access to all users
    # [CHANGE: Restrict if docs should be internal only]
    Require all granted
    
    # ----------------------------------------
    # Content Negotiation Setup
    # ----------------------------------------
    # Enable type-map handler for .html files
    # This allows serving different language versions
    <Files *.html>
        SetHandler type-map
    </Files>
    
    # ----------------------------------------
    # Language Configuration
    # ----------------------------------------
    # Fix conflict: .tr extension is text/troff in mime.types
    # but we need it for Turkish language files
    RemoveType tr
    
    # Danish traditionally used .dk extension
    AddLanguage da .da
    
    # ----------------------------------------
    # Language Detection
    # ----------------------------------------
    # Set preferred language based on URL path
    # If URL contains /manual/XX/, set prefer-language to XX
    SetEnvIf Request_URI ^/manual/(da|de|en|es|fr|ja|ko|pt-br|ru|tr|zh-cn)/ prefer-language=$1
    
    # ----------------------------------------
    # URL Cleanup
    # ----------------------------------------
    # Prevent duplicate language codes in URL
    # Redirects /manual/en/en/index.html to /manual/en/index.html
    RedirectMatch 301 ^/manual(?:/(da|de|en|es|fr|ja|ko|pt-br|ru|tr|zh-cn)){2,}(/.*)?$ /manual/$1$2
    
    # ----------------------------------------
    # Language Priority
    # ----------------------------------------
    # Order reflects translation completeness (most to least content)
    # Based on translated .xml source document count:
    #   en: 266 (complete)
    #   fr: 214 (well translated)
    #   ko: 110 (moderately translated)
    #   ja: 94  (partially translated)
    #   tr: 82  (partially translated)
    #   es: 25  (limited translation)
    #   de: 22  (limited translation)
    #   zh-cn: 18 (minimal translation)
    #   pt-br: 4  (minimal translation)
    #   da: 1   (minimal translation)
    #   ru: 1   (minimal translation)
    LanguagePriority en fr ko ja tr es de zh-cn pt-br da ru
    
    # If exact language match not found:
    # Prefer: Use best match from LanguagePriority
    # Fallback: Use any available rather than error
    ForceLanguagePriority Prefer Fallback
</Directory>

# ============================================
# Security Considerations
# ============================================
# The Apache manual contains:
# - Server configuration examples
# - Module documentation
# - Security guidelines
#
# Consider restricting access in production:
# <Directory "/usr/local/apache2/manual">
#     Require ip 192.168.1.0/24
#     # Or require authentication
#     # AuthType Basic
#     # AuthName "Documentation Access"
#     # AuthUserFile /usr/local/apache2/conf/.htpasswd-docs
#     # Require valid-user
# </Directory>

# ============================================
# Customization Options
# ============================================
# 1. To serve docs at a different URL:
#    Change the AliasMatch pattern
#
# 2. To add custom documentation:
#    Place files in /usr/local/apache2/manual/custom/
#
# 3. To set a default language:
#    Add: DefaultLanguage en
#
# 4. To disable certain languages:
#    Remove them from the AliasMatch pattern

# ============================================
# Troubleshooting
# ============================================
# 1. 404 errors: Check if manual directory exists
#    ls -la /usr/local/apache2/manual/
#
# 2. Wrong language served: Check browser language settings
#
# 3. Missing images/styles: Ensure all manual files copied
#
# 4. Access denied: Check Directory permissions
# ============================================