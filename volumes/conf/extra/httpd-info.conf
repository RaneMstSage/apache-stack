# ============================================
# Required Module Loading
# ============================================
# Ensure these modules are loaded in main Apache configuration:
# LoadModule status_module modules/mod_status.so
# LoadModule info_module modules/mod_info.so
#
# To verify modules are loaded:
# docker exec apache1 httpd -M | grep -E "(status|info)"

# ============================================
# Security Considerations
# ============================================
# 1. server-status and server-info expose sensitive information
# 2. Always restrict access to trusted IPs or localhost
# 3. Consider using HTTPS if accessing over network
# 4. For Docker environments, containers see different IP ranges
# 5. Use ExtendedStatus=On only if you need the extra details
# 6. server-info reveals configuration details, file paths, and modules

# ============================================
# Docker-Specific Notes
# ============================================
# When running in Docker with Nginx proxy:
# - Requests come from Nginx container IP (172.x.x.x range)
# - Localhost (127.0.0.1) only works from within the container
# - Docker bridge network uses 172.16.0.0/12 by default
# - For docker-compose setups, containers communicate via internal IPs
#
# Direct container access:
# docker exec apache1 curl http://localhost/server-status
# docker exec apache1 curl http://localhost/server-info
#
# Via Nginx proxy (your setup):
# http://localhost/server-status (through nginx → apache backend)
# http://localhost/server-info (through nginx → apache backend)

# ============================================
# Useful Status URLs
# ============================================
# Basic status:
#   http://localhost/server-status
#
# Auto-refresh status:
#   http://localhost/server-status?refresh=5
#
# Machine-readable format:
#   http://localhost/server-status?auto
#
# Server configuration:
#   http://localhost/server-info
#
# Specific module info:
#   http://localhost/server-info?mod_ssl.c
#   http://localhost/server-info?config

# ============================================
# Troubleshooting
# ============================================
# 1. If you get 404 errors:
#    - Verify mod_status and mod_info are loaded
#    - Check that the Location blocks are properly configured
#    - Ensure this file is included in main Apache config
#
# 2. If you get 403 Forbidden:
#    - Check the Require directives match your network setup
#    - Verify requests are coming from allowed IP ranges
#    - For Docker: Ensure 172.16.0.0/12 range is allowed
#
# 3. If server-info shows 404 but server-status works:
#    - Load mod_info module: LoadModule info_module modules/mod_info.so
#    - Restart Apache after adding the module
#
# 4. To check which modules are loaded:
#    docker exec apache1 httpd -M | grep -E "(status|info)"
#
# 5. To verify IP ranges in Docker:
#    docker network inspect <network_name>
#    docker exec nginx ip route
# ============================================