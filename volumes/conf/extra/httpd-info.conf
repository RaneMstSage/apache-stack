# ============================================
# Apache Server Information Configuration
# ============================================
# Get information about the requests being processed by the server
# and the configuration of the server
#
# Required modules: mod_authz_core, mod_authz_host,
#                   mod_info (for the server-info handler),
#                   mod_status (for the server-status handler)

# ============================================
# Server Status Reports
# ============================================
# Allow server status reports generated by mod_status
# URL: http://servername/server-status
# Shows current server activity and performance

<Location /server-status>
    SetHandler server-status
    
    # ----------------------------------------
    # Access Control
    # ----------------------------------------
    # Allow from localhost (container internal)
    Require local
    Require ip 127.0.0.1
    Require ip ::1
    
    # Allow from Docker network (for Nginx proxy)
    Require ip 172.16.0.0/12
    
    # [OPTIONAL: Allow from additional networks]
    # Require ip 192.168.1.0/24
    # Require ip 10.0.0.0/8
    
    # [ALTERNATIVE: Allow all access (NOT RECOMMENDED for production)]
    # Require all granted
</Location>

# ============================================
# Extended Status Information
# ============================================
# Controls the amount of information provided by server-status
# On = Full status including per-request details
# Off = Basic status only (default)
# Enabling this has minimal performance impact on modern systems

# [UNCOMMENT to enable detailed status]
#ExtendedStatus On

# ============================================
# Server Configuration Reports
# ============================================
# Allow remote server configuration reports with mod_info
# URL: http://servername/server-info
# Shows loaded modules, configuration directives, and more

<Location /server-info>
    SetHandler server-info
    
    # ----------------------------------------
    # Access Control
    # ----------------------------------------
    # Allow from localhost (container internal)
    Require local
    Require ip 127.0.0.1
    Require ip ::1
    
    # Allow from Docker network (for Nginx proxy)
    Require ip 172.16.0.0/12
    
    # [OPTIONAL: Allow from additional networks]
    # Require ip 192.168.1.0/24
    # Require ip 10.0.0.0/8
    
    # [ALTERNATIVE: Allow all access (NOT RECOMMENDED for production)]
    # Require all granted
    
    # WARNING: server-info exposes sensitive configuration
    # Be very careful about who can access this endpoint
</Location>

# ============================================
# Additional Status Endpoints (Optional)
# ============================================
# You can create custom status endpoints for different purposes

# Example: Health check endpoint for load balancers
#<Location /health>
#    SetHandler server-status
#    # Allow from load balancer IPs only
#    Require ip 10.0.0.100
#    Require ip 10.0.0.101
#</Location>

