# ============================================
# Apache User Directory Configuration
# ============================================
# Settings for serving content from user home directories
# Allows URLs like http://yourserver/~username/ to serve from
# user's public_html directory
#
# Required modules: mod_authz_core, mod_authz_host, mod_userdir

# ============================================
# UserDir Configuration
# ============================================
# The name of the directory that is appended onto a user's home
# directory if a ~user request is received
#
# Examples:
# UserDir public_html     -> /home/username/public_html/
# UserDir www            -> /home/username/www/
# UserDir disabled       -> Disable all user directories
# UserDir enabled user1 user2 -> Enable only for specific users
UserDir public_html

# ============================================
# Security Options (Optional)
# ============================================
# [UNCOMMENT to restrict user directories]

# Disable for root user (highly recommended)
# UserDir disabled root

# Disable for system users
# UserDir disabled daemon bin sys sync games man lp mail news uucp proxy

# Enable only for specific users
# UserDir disabled
# UserDir enabled john jane developer

# ============================================
# User Directory Access Control
# ============================================
# Control access to UserDir directories
# This example restricts directories to read-only access
<Directory "/home/*/public_html">
    # ----------------------------------------
    # Override Permissions
    # ----------------------------------------
    # What .htaccess files can override
    # FileInfo: Allow document type directives
    # AuthConfig: Allow authentication directives
    # Limit: Allow access control directives
    # Indexes: Allow directory indexing directives
    AllowOverride FileInfo AuthConfig Limit Indexes
    
    # ----------------------------------------
    # Directory Options
    # ----------------------------------------
    # MultiViews: Content negotiation (language selection)
    # Indexes: Show directory listings if no index file
    # SymLinksIfOwnerMatch: Follow symlinks if owner matches
    # IncludesNoExec: SSI allowed but no exec cmd/cgi
    Options MultiViews Indexes SymLinksIfOwnerMatch IncludesNoExec
    
    # ----------------------------------------
    # Access Control
    # ----------------------------------------
    # Restrict to read-only methods
    Require method GET POST OPTIONS
    
    # [ALTERNATIVE: Allow all access]
    # Require all granted
    
    # [ALTERNATIVE: Require authentication]
    # AuthType Basic
    # AuthName "User Directory"
    # AuthUserFile /usr/local/apache2/conf/.htpasswd
    # Require valid-user
</Directory>

# ============================================
# Alternative Configurations
# ============================================

# ----------------------------------------
# Example 1: Full access for user directories
# ----------------------------------------
# <Directory "/home/*/public_html">
#     AllowOverride All
#     Options MultiViews Indexes FollowSymLinks
#     Require all granted
# </Directory>

# ----------------------------------------
# Example 2: PHP execution in user directories
# ----------------------------------------
# <Directory "/home/*/public_html">
#     AllowOverride All
#     Options MultiViews Indexes FollowSymLinks ExecCGI
#     Require all granted
#     
#     # Enable PHP
#     <FilesMatch \.php$>
#         SetHandler "proxy:fcgi://php:9000"
#     </FilesMatch>
# </Directory>

# ----------------------------------------
# Example 3: Per-user CGI directories
# ----------------------------------------
# <Directory "/home/*/public_html/cgi-bin">
#     Options ExecCGI
#     SetHandler cgi-script
#     Require all granted
# </Directory>

# ============================================
# Docker Considerations
# ============================================
# In Docker environments, user directories typically don't exist
# because containers don't have real system users. Consider:
#
# 1. Creating virtual user directories:
#    mkdir -p /usr/local/apache2/users/john/public_html
#    
# 2. Using Alias instead of UserDir:
#    Alias /~john /usr/local/apache2/users/john/public_html
#
# 3. Mounting host user directories:
#    volumes:
#      - /home:/home:ro

# ============================================
# Security Best Practices
# ============================================
# 1. Always disable UserDir for system accounts
# 2. Consider disabling PHP execution in user dirs
# 3. Limit allowed overrides in .htaccess
# 4. Set strict file permissions (755 dirs, 644 files)
# 5. Consider quotas to prevent disk filling
# 6. Monitor user directories for malicious content

# ============================================
# URL Rewriting for Clean URLs
# ============================================
# [OPTIONAL: Remove tilde from URLs]
# <IfModule mod_rewrite.c>
#     RewriteEngine On
#     # Redirect /users/john to /~john
#     RewriteRule ^/users/([^/]+)(.*)$ /~$1$2 [PT]
# </IfModule>

# ============================================
# Troubleshooting
# ============================================
# 1. "403 Forbidden" - Check directory permissions:
#    chmod 755 /home/username
#    chmod 755 /home/username/public_html
#    chmod 644 /home/username/public_html/*
#
# 2. "404 Not Found" - Verify UserDir is enabled:
#    httpd -M | grep userdir
#
# 3. PHP not working - Add PHP handler to Directory block
#
# 4. Cannot follow symlinks - Check symlink ownership:
#    ls -la /home/username/public_html/
# ============================================