# ============================================
# Apache Multi-Processing Module (MPM) Configuration
# ============================================
# Controls how Apache handles multiple requests through different
# process/thread models. Only ONE MPM can be active at a time.
#
# To check which MPM is active: apachectl -l | grep mpm

# ============================================
# Process ID File
# ============================================
# File where Apache stores its main process ID
# Used by control scripts to manage the server
<IfModule !mpm_netware_module>
    PidFile "logs/httpd.pid"
</IfModule>

# ============================================
# MPM Selection Guide
# ============================================
# prefork: One process per request (most compatible, least efficient)
# worker:  Hybrid processes/threads (good performance)
# event:   Like worker but better for keep-alive (recommended)
#
# The active MPM is compiled into Apache. Use ONE configuration below.

# ============================================
# Prefork MPM (Process-Based)
# ============================================
# Traditional model: Each request handled by a separate process
# Pros: Maximum compatibility, isolation between requests
# Cons: High memory usage, slower than threaded MPMs
# Use when: Running non-thread-safe modules (like mod_php)
#
# <IfModule mpm_prefork_module>
#     StartServers             5       # Initial number of server processes
#     MinSpareServers          5       # Minimum idle processes
#     MaxSpareServers         10       # Maximum idle processes
#     MaxRequestWorkers      250       # Maximum simultaneous requests
#     MaxConnectionsPerChild   0       # Requests per process (0=unlimited)
# </IfModule>

# ============================================
# Worker MPM (Hybrid Process/Thread)
# ============================================
# Hybrid model: Multiple threads per process
# Pros: Lower memory usage than prefork, good performance
# Cons: All threads die if process crashes
# Use when: Need better performance than prefork
#
# <IfModule mpm_worker_module>
#     StartServers             3       # Initial number of server processes
#     MinSpareThreads         75       # Minimum idle threads (all processes)
#     MaxSpareThreads        250       # Maximum idle threads (all processes)
#     ThreadsPerChild         25       # Threads per process
#     MaxRequestWorkers      400       # Maximum threads (all processes)
#     MaxConnectionsPerChild   0       # Connections per process (0=unlimited)
# </IfModule>

# ============================================
# Event MPM (High-Performance)
# ============================================
# Advanced model: Like worker but with dedicated listener thread
# Pros: Best performance, handles keep-alive connections efficiently
# Cons: Requires thread-safe modules
# Use when: High-traffic sites, many keep-alive connections (RECOMMENDED)
#
<IfModule mpm_event_module>
    StartServers 3
    MinSpareThreads 75
    MaxSpareThreads 250
    ThreadsPerChild 25
    MaxRequestWorkers 400
    MaxConnectionsPerChild 0
    
    # Additional Event MPM settings (optional)
    # AsyncRequestWorkerFactor 2
</IfModule>

# ============================================
# Platform-Specific MPMs (Rarely Used)
# ============================================

# ----------------------------------------
# NetWare MPM
# ----------------------------------------
# <IfModule mpm_netware_module>
#     ThreadStackSize      65536      # Stack size per thread
#     StartThreads           250      # Initial threads
#     MinSpareThreads         25      # Minimum idle threads
#     MaxSpareThreads        250      # Maximum idle threads
#     MaxThreads            1000      # Maximum total threads
#     MaxConnectionsPerChild   0      # Connections per thread
# </IfModule>

# ----------------------------------------
# OS/2 MPM
# ----------------------------------------
# <IfModule mpm_mpmt_os2_module>
#     StartServers             2      # Server processes
#     MinSpareThreads          5      # Minimum idle threads per process
#     MaxSpareThreads         10      # Maximum idle threads per process
#     MaxConnectionsPerChild   0      # Connections per process
# </IfModule>

# ----------------------------------------
# Windows NT MPM
# ----------------------------------------
# <IfModule mpm_winnt_module>
#     ThreadLimit           2048      # Maximum possible ThreadsPerChild
#     ThreadsPerChild       2048      # Threads in the single process
#     MaxConnectionsPerChild   0      # Connections before restart
# </IfModule>

# ============================================
# Memory Management
# ============================================
# Maximum memory (KB) each allocator can hold without calling free()
# In threaded MPMs, each thread has its own allocator
# 0 = unlimited (default)
#
# <IfModule !mpm_netware_module>
#     MaxMemFree            4096      # 4MB per allocator
# </IfModule>
# <IfModule mpm_netware_module>
#     MaxMemFree             100      # 100KB for NetWare
# </IfModule>

# ============================================
# Tuning Guide for Event MPM
# ============================================
# Current settings support:
# - 3 processes × 25 threads = 75 threads minimum
# - Up to 400 total threads maximum
# - 400 simultaneous connections
#
# To increase capacity:
# 1. Increase MaxRequestWorkers (must be multiple of ThreadsPerChild)
# 2. Adjust StartServers if needed (MaxRequestWorkers/ThreadsPerChild)
# 3. Monitor memory usage and adjust accordingly
#
# Example for high traffic (1600 connections):
# StartServers            8
# ThreadsPerChild        25  
# MaxRequestWorkers    1600
# MinSpareThreads       100
# MaxSpareThreads       300

# ============================================
# Load Balancer Considerations
# ============================================
# With your 3-node Apache setup (apache1, apache2, apache3):
# - Each node can handle 400 connections
# - Total capacity: 1200 connections
# - Nginx distributes load across all three
# - Consider identical MPM settings on all nodes

# ============================================
# Monitoring Commands
# ============================================
# Check current connections:
#   apache2ctl status
#
# See detailed status (if mod_status enabled):
#   curl http://localhost/server-status?auto
#
# Monitor process/thread count:
#   ps aux | grep httpd | wc -l
#   ps -eLf | grep httpd | wc -l
# ============================================