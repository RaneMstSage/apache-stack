# Lua Configuration for Apache
LoadModule lua_module modules/mod_lua.so

<IfModule lua_module>
    # Set Lua package path for modules
    LuaPackagePath "/usr/local/apache2/lua/?.lua;/usr/local/apache2/lua/?/init.lua"
    LuaPackageCPath "/usr/local/apache2/lua/?.so"
    
    # Set code cache for better performance
    LuaCodeCache stat
    
    # Enable Lua hooks (optional)
    # LuaHookTranslateName /usr/local/apache2/lua/hooks.lua hooks_translate_name early
    
    # Map specific Lua handlers
    # Basic info script
    LuaMapHandler "/lua/info" "/usr/local/apache2/htdocs/lua-info.lua"
    
    # Map a basic application
    LuaMapHandler "/lua/basic" "/usr/local/apache2/htdocs/basic-lua.lua"
    
    # Map an application directory (processes all *.lua files)
    <Directory "/usr/local/apache2/htdocs/lua-apps">
        AddHandler lua-script .lua
        DirectoryIndex index.lua
    </Directory>
    
    # Logging for Lua module (uncomment for debugging)
    # LogLevel info lua:info
    
    # Create a scope for a specific application (uncomment and customize as needed)
    # <Location /lua/app>
    #     LuaScope thread
    #     LuaCodeCache forever
    #     SetHandler lua-script
    # </Location>
</IfModule>