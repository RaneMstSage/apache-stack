# ============================================
# Performance Tips
# ============================================
# 1. Use LuaCodeCache forever in production
# 2. Use LuaScope thread for thread safety
# 3. Minimize global variables
# 4. Pre-compile Lua scripts with luac
# 5. Use connection pooling for databases

# ============================================
# Troubleshooting
# ============================================
# 1. Check error log for Lua errors:
#    tail -f logs/error_log | grep lua
#
# 2. Verify Lua module is loaded:
#    httpd -M | grep lua
#
# 3. Test script syntax:
#    lua -c /path/to/script.lua
#
# 4. Common errors:
#    - "attempt to index nil" - Missing request object
#    - "module not found" - Check LuaPackagePath
#    - Permission denied - Check file ownership
# ============================================