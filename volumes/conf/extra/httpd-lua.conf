# ============================================
# Apache Lua Module Configuration
# ============================================
# Enables Lua scripting support in Apache for dynamic content
# and server-side logic without external processes
#
# Required module: mod_lua

# Load the Lua module
LoadModule lua_module modules/mod_lua.so

<IfModule lua_module>
    # ============================================
    # Lua Package Paths
    # ============================================
    # Define where Lua looks for modules and libraries
    
    # Lua script search path (.lua files)
    # Similar to LUA_PATH environment variable
    LuaPackagePath "/usr/local/apache2/lua/?.lua;/usr/local/apache2/lua/?/init.lua"
    
    # Lua C module search path (.so files)
    # Similar to LUA_CPATH environment variable
    LuaPackageCPath "/usr/local/apache2/lua/?.so"
    
    # ============================================
    # Code Cache Configuration
    # ============================================
    # Controls how Lua scripts are cached for performance
    #
    # Options:
    # - stat: Check file modification time (development mode)
    # - forever: Cache forever (production mode)
    # - never: Never cache (debugging only)
    LuaCodeCache stat
    
    # ============================================
    # Lua Hooks (Advanced)
    # ============================================
    # Hook into Apache request processing phases
    # Useful for authentication, URL rewriting, logging, etc.
    
    # [UNCOMMENT to enable custom request processing]
    # LuaHookTranslateName /usr/local/apache2/lua/hooks.lua hooks_translate_name early
    # LuaHookAccessChecker /usr/local/apache2/lua/hooks.lua check_access late
    # LuaHookAuthChecker /usr/local/apache2/lua/hooks.lua check_auth
    
    # ============================================
    # Mapped Lua Handlers
    # ============================================
    # Map specific URLs to Lua scripts
    
    # Basic information script
    # Access at: http://yourserver/lua/info
    LuaMapHandler "/lua/info" "/usr/local/apache2/htdocs/lua-info.lua"
    
    # Basic application example
    # Access at: http://yourserver/lua/basic
    LuaMapHandler "/lua/basic" "/usr/local/apache2/htdocs/basic-lua.lua"
    
    # [OPTIONAL: Add more mapped handlers]
    # LuaMapHandler "/lua/api" "/usr/local/apache2/htdocs/api.lua"
    # LuaMapHandler "/lua/admin" "/usr/local/apache2/htdocs/admin.lua"
    
    # ============================================
    # Lua Application Directory
    # ============================================
    # Configure a directory where all .lua files are executable
    <Directory "/usr/local/apache2/htdocs/lua-apps">
        # Make all .lua files executable as Lua scripts
        AddHandler lua-script .lua
        
        # Default file when accessing directory
        DirectoryIndex index.lua
        
        # [OPTIONAL: Add access controls]
        # Require all granted
        
        # [OPTIONAL: Set custom environment]
        # SetEnv LUA_APP_ENV production
    </Directory>
    
    # ============================================
    # Logging Configuration
    # ============================================
    # Control Lua module logging verbosity
    
    # [UNCOMMENT for debugging]
    # LogLevel info lua:trace1
    
    # Log levels for mod_lua:
    # - lua:error   - Only errors
    # - lua:warn    - Warnings and errors
    # - lua:info    - General information
    # - lua:debug   - Detailed debugging
    # - lua:trace1-8 - Very detailed trace information
    
    # ============================================
    # Application-Specific Configurations
    # ============================================
    # Create isolated scopes for different applications
    
    # [EXAMPLE: High-performance API endpoint]
    # <Location /lua/api>
    #     # Use thread-local scope for thread safety
    #     LuaScope thread
    #     
    #     # Cache scripts forever in production
    #     LuaCodeCache forever
    #     
    #     # Set Lua as the handler
    #     SetHandler lua-script
    #     
    #     # Set application-specific paths
    #     LuaPackagePath "/usr/local/apache2/lua-apps/api/?.lua"
    # </Location>
    
    # [EXAMPLE: Development sandbox]
    # <Location /lua/dev>
    #     # Server-wide scope (careful with globals!)
    #     LuaScope server
    #     
    #     # Never cache for development
    #     LuaCodeCache never
    #     
    #     SetHandler lua-script
    # </Location>
    
    # ============================================
    # Lua Quick Actions
    # ============================================
    # Quick inline Lua scripts for simple tasks
    
    # [EXAMPLE: Simple redirect]
    # <Location /old-page>
    #     LuaQuickHandler "
    #         r.status = 301
    #         r.headers_out['Location'] = '/new-page'
    #         return apache2.DONE
    #     "
    # </Location>
    
    # [EXAMPLE: Add custom header]
    # <Location /api/*>
    #     LuaHookFixups "
    #         r.headers_out['X-Powered-By'] = 'Lua/5.4'
    #     "
    # </Location>
    
    # ============================================
    # Database Connection Pooling (Optional)
    # ============================================
    # Configure database connections for Lua scripts
    
    # [EXAMPLE: MySQL connection pool]
    # LuaDBDDriver mysql
    # LuaDBDConnectionPool "host=localhost dbname=myapp user=lua password=secret"
    # LuaDBDPoolMin 5
    # LuaDBDPoolMax 25
    # LuaDBDPoolTTL 600
</IfModule>

