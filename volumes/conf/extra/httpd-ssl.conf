# ============================================
# Apache SSL Configuration Behind Proxy
# ============================================
# Minimal SSL configuration for Apache running behind an SSL-terminating
# proxy (Nginx). The proxy handles actual SSL/TLS connections, while
# Apache needs to be aware that requests are secure.
#
# Required modules: mod_ssl, mod_socache_shmcb, mod_setenvif, mod_headers

# ============================================
# Load SSL Modules
# ============================================
# Load SSL module (required even behind proxy)
LoadModule ssl_module modules/mod_ssl.so

# Load shared memory cache module for SSL sessions
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# ============================================
# SSL Proxy Detection
# ============================================
# Detect when requests come through HTTPS proxy
# Nginx sets X-Forwarded-Proto header to indicate protocol

# Set HTTPS environment variable when proxy indicates SSL
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Pass the protocol information to backend applications
RequestHeader set X-Forwarded-Proto "https" env=HTTPS

# ============================================
# SSL Engine Configuration
# ============================================
# SSL Engine remains OFF because Nginx handles SSL termination
# Apache only needs to handle plain HTTP from Nginx
SSLEngine off

# Export SSL environment variables for scripts/apps that check them
# Even though SSL is handled by proxy, apps may need these variables
SSLOptions +StdEnvVars

# [OPTIONAL: Additional SSL environment exports]
# SSLOptions +ExportCertData  # Export client certificate data
# SSLOptions +FakeBasicAuth   # Use client cert CN as username

# ============================================
# SSL Session Cache
# ============================================
# Required directives even when SSL is off
# Prevents startup warnings and prepares for potential direct SSL

# Configure shared memory cache for SSL sessions
# Format: shmcb:/path/to/cache(size_in_bytes)
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)

# Session cache timeout (5 minutes)
SSLSessionCacheTimeout 300

# ============================================
# Additional Proxy-Aware Settings
# ============================================
# [OPTIONAL: Uncomment if needed]

# Trust proxy IP for SSL information
# SetEnvIf Remote_Addr "^172\.16\." TRUSTED_PROXY=1

# Preserve original protocol in redirects
# Header edit Location ^http://(.*)$ https://$1 env=HTTPS

# ============================================
# Direct SSL Configuration (If Needed)
# ============================================
# If you need Apache to handle SSL directly (not recommended
# with Nginx proxy), uncomment and configure this section:

# <VirtualHost *:443>
#     ServerName code.mstsage.com
#     
#     # Enable SSL for this virtual host
#     SSLEngine on
#     
#     # Certificate files
#     SSLCertificateFile /usr/local/apache2/conf/server.crt
#     SSLCertificateKeyFile /usr/local/apache2/conf/server.key
#     # SSLCertificateChainFile /usr/local/apache2/conf/chain.crt
#     
#     # Modern SSL configuration
#     SSLProtocol -all +TLSv1.2 +TLSv1.3
#     SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
#     SSLHonorCipherOrder off
#     
#     # HSTS Header (if not set by Nginx)
#     # Header always set Strict-Transport-Security "max-age=63072000"
# </VirtualHost>

# ============================================
# Backend Application Considerations
# ============================================
# Applications behind the proxy should check for SSL using:
#
# 1. PHP:
#    if ($_SERVER['HTTP_X_FORWARDED_PROTO'] == 'https') { }
#    or
#    if (!empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] != 'off') { }
#
# 2. Python/WSGI:
#    if environ.get('HTTP_X_FORWARDED_PROTO') == 'https': 
#
# 3. Apache RewriteRule:
#    RewriteCond %{HTTP:X-Forwarded-Proto} ^https$

# ============================================
# Security Headers (If Not Set by Nginx)
# ============================================
# These are typically set by Nginx, but can be set here as backup

# <IfModule headers_module>
#     # Only set if not already set by proxy
#     Header setifempty X-Content-Type-Options "nosniff"
#     Header setifempty X-Frame-Options "SAMEORIGIN"
#     Header setifempty X-XSS-Protection "1; mode=block"
#     Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
# </IfModule>

# ============================================
# Troubleshooting SSL Behind Proxy
# ============================================
# 1. Check if Apache sees HTTPS:
#    Create test.php: <?php var_dump($_SERVER['HTTPS']); ?>
#
# 2. Verify headers from Nginx:
#    docker exec apache1 tcpdump -i any -A 'port 80'
#
# 3. Test environment variables:
#    SetEnvIf X-Forwarded-Proto "^https$" HTTPS_TEST=yes
#    CustomLog logs/ssl_test.log "%{HTTPS_TEST}e" env=HTTPS_TEST
#
# 4. Common issues:
#    - Redirect loops: Check proxy and Apache redirect rules
#    - Mixed content: Ensure all URLs use proper protocol
#    - Lost headers: Verify Nginx passes X-Forwarded-Proto

# ============================================
# Docker & Nginx Integration Notes
# ============================================
# 1. Nginx should include these headers:
#    proxy_set_header X-Forwarded-Proto $scheme;
#    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#    proxy_set_header X-Real-IP $remote_addr;
#
# 2. This config assumes Nginx handles:
#    - SSL/TLS termination
#    - Certificate management
#    - HTTPS redirects
#    - Security headers
#
# 3. Apache only needs to:
#    - Recognize secure requests
#    - Pass SSL status to applications
#    - Handle HTTP from Nginx
# ============================================