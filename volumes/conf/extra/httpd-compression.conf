# ============================================
# Apache Compression Configuration
# ============================================
# Controls HTTP compression for bandwidth optimization
# Supports gzip and Brotli compression methods
#
# Note: For large file repositories (SVN/Git), compression may be
# disabled to prevent CPU overhead and download issues

# ============================================
# MIME Type Definitions
# ============================================
# Define MIME types and encodings for compressed content
<IfModule mod_mime.c>
    # JavaScript files and compressed variants
    AddType application/javascript .js .js.gz .js.br
    
    # WebAssembly files and compressed variants
    AddType application/wasm .wasm .wasm.gz .wasm.br
    
    # Data files
    AddType application/gzip .data.gz
    AddType application/octet-stream .data .data.br .symbols.json .symbols.json.br
    
    # Define compression encodings
    AddEncoding gzip .gz
    AddEncoding br .br
</IfModule>

# ============================================
# Dynamic Compression - Deflate (gzip)
# ============================================
# Compress content on-the-fly for supported MIME types
<IfModule mod_deflate.c>
    # Enable compression for text-based content
    # Excludes binary formats to avoid overhead
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    
    # Note: Large files (SVN/Git repos) may bypass compression
    # based on settings in httpd-svn.conf and httpd-git.conf
</IfModule>

# ============================================
# Dynamic Compression - Brotli
# ============================================
# More efficient compression than gzip but requires more CPU
<IfModule mod_brotli.c>
    # Enable Brotli compression for text-based content
    # Provides better compression ratios than gzip
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css application/javascript application/json
</IfModule>

# ============================================
# Pre-compressed Content Headers
# ============================================
# Handle pre-compressed static files (.gz and .br extensions)
<IfModule mod_headers.c>
    # ----------------------------------------
    # Gzip Pre-compressed Files
    # ----------------------------------------
    <FilesMatch "\.gz$">
        # Identify as gzip-encoded content
        Header set Content-Encoding gzip
        
        # Cache for 1 year (31536000 seconds)
        Header set Cache-Control "max-age=31536000, public"
        
        # Indicate content varies by encoding
        Header set Vary "Accept-Encoding"
    </FilesMatch>
    
    # Force correct MIME types for gzipped files
    <FilesMatch "\.js\.gz$">
        ForceType application/javascript
    </FilesMatch>
    
    <FilesMatch "\.wasm\.gz$">
        ForceType application/wasm
    </FilesMatch>
    
    <FilesMatch "\.data\.gz$">
        ForceType application/gzip
    </FilesMatch>
    
    # ----------------------------------------
    # Brotli Pre-compressed Files
    # ----------------------------------------
    <FilesMatch "\.br$">
        # Identify as Brotli-encoded content
        Header set Content-Encoding br
        
        # Cache for 1 year
        Header set Cache-Control "max-age=31536000, public"
        
        # Indicate content varies by encoding
        Header set Vary "Accept-Encoding"
    </FilesMatch>
    
    # Force correct MIME types for Brotli files
    <FilesMatch "\.js\.br$">
        ForceType application/javascript
    </FilesMatch>
    
    <FilesMatch "\.wasm\.br$">
        ForceType application/wasm
    </FilesMatch>
    
    <FilesMatch "\.data\.br$">
        ForceType application/octet-stream
    </FilesMatch>
    
    # ----------------------------------------
    # Cross-Origin Headers for Unity WebGL
    # ----------------------------------------
    # Required for Unity WebGL builds to work properly
    # Applies to HTML, JS, WASM, and data files
    <FilesMatch "\.(htm|html|js|js\.gz|js\.br|wasm|wasm\.gz|wasm\.br|data|data\.gz|data\.br)$">
        # Security policies for cross-origin isolation
        Header add Cross-Origin-Opener-Policy "same-origin"
        Header add Cross-Origin-Embedder-Policy "require-corp"
        Header add Cross-Origin-Resource-Policy "cross-origin"
    </FilesMatch>
</IfModule>

# ============================================
# Compression Notes
# ============================================
# 1. Pre-compressed files (.gz, .br) are served directly
#    without additional compression
#
# 2. Dynamic compression applies to uncompressed files
#    matching the specified MIME types
#
# 3. For optimal performance with large repositories,
#    consider disabling compression for specific paths
#    in virtual host configurations
#
# 4. Brotli typically achieves 20-30% better compression
#    than gzip but uses more CPU
# ============================================