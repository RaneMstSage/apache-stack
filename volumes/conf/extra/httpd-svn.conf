# ============================================
# Apache Subversion (SVN) Configuration
# ============================================
# Configures Apache to serve Subversion repositories via HTTP/HTTPS
# using mod_dav_svn for WebDAV access to repositories
#
# Required modules: mod_dav, mod_dav_svn, mod_authz_svn,
#                   mod_authn_core, mod_authz_core, mod_authnz_ldap

# ============================================
# SVN Global Performance Settings
# ============================================
# Disable compression for large files and better performance
# 0 = no compression, 1-9 = compression level (higher = more CPU)
# SVN already compresses repository data internally
SVNCompressionLevel 0

# Set in-memory cache size for better performance
# Value is in KB (32768 = 32MB)
SVNInMemoryCacheSize 32768

# ============================================
# Request Timeout Configuration
# ============================================
# Override global timeouts for SVN operations
# Large file operations need extended timeouts
<IfModule reqtimeout_module>
    # Header timeout: 30-60 seconds with minimum rate of 500 bytes/sec
    # Body timeout: 3600 seconds (1 hour) with minimum rate of 1000 bytes/sec
    RequestReadTimeout header=30-60,MinRate=500 body=3600,MinRate=1000
</IfModule>

# ============================================
# Compression Bypass Configuration
# ============================================
# Disable Apache compression for SVN paths to prevent
# double compression and protocol issues

# Disable mod_deflate compression for SVN
<IfModule mod_deflate.c>
    SetEnvIf Request_URI "^/svn/" no-gzip
</IfModule>

# Disable Brotli compression for SVN
<IfModule mod_brotli.c>
    SetEnvIf Request_URI "^/svn/" no-brotli
</IfModule>

# ============================================
# Main Subversion Repository Configuration
# ============================================
# This sets up the parent path for all repositories
# Access URLs will be: http://yourserver/svn/repository-name
<Location /svn>
    # Enable DAV provider for SVN
    DAV svn

    # Parent directory containing all repositories
    SVNParentPath /usr/local/apache2/svn

    # Allow listing of all repositories at /svn/
    SVNListParentPath on
    
    # ----------------------------------------
    # Authentication Configuration
    # ----------------------------------------
    # LDAP Authentication
    AuthType Basic
    AuthName "Subversion Repository"
    AuthBasicProvider ldap

    # LDAP connection settings
    # [CHANGE: Update domain to match LDAP_DOMAIN in .env file]
    AuthLDAPURL "ldap://openldap:389/ou=Users,dc=[YOUR_DOMAIN_FROM_ENV]?uid?sub?(objectClass=*)"

    # LDAP bind credentials
    # [CHANGE: Update domain to match LDAP_DOMAIN in .env file]
    AuthLDAPBindDN "cn=admin,dc=[YOUR_DOMAIN_FROM_ENV]"
    AuthLDAPBindPassword "[COPY_FROM_ENV_FILE]"
    
    # Copy LDAP_ADMIN_PASSWORD value from your .env file

    # Don't follow LDAP referrals
    LDAPReferrals Off
    
    # Require valid LDAP user
    Require valid-user
    
    # ----------------------------------------
    # SVN Performance Optimizations
    # ----------------------------------------
    # These settings optimize for large files
    
    # Disable caching of text deltas - reduces memory usage
    SVNCacheTextDeltas off

    # Disable full text caching - reduces memory usage for large files
    SVNCacheFullTexts off
    
    # Disable revision property caching
    SVNCacheRevProps off

    # Enable node property caching for better performance
    SVNCacheNodeProps on

    # Disable block read mode - better for large files
    SVNBlockRead off

    # Prefer bulk updates for better performance
    SVNAllowBulkUpdates prefer

    # Remove request body limits for large commits
    LimitRequestBody 0
    LimitXMLRequestBody 0
</Location>

# ============================================
# Repository Collection Examples
# ============================================
# SVN supports nested repository structures:
# /svn/                    - Main parent (all repos)
# /svn/repo1/              - Direct repository
# /svn/users/john/repo1/   - User collection
# /svn/projects/web/repo1/ - Project collection

# ----------------------------------------
# Example: User-Specific Repository Collection
# ----------------------------------------
# [OPTIONAL: Uncomment and modify for user collections]
# <Location /svn/users/johndoe>
#     DAV svn
#     SVNParentPath /usr/local/apache2/svn/users/johndoe
#     SVNListParentPath on
#     
#     # Same auth configuration as main
#     AuthType Basic
#     AuthName "John Doe's Repositories"
#     AuthBasicProvider ldap
#     AuthLDAPURL "ldap://openldap:389/ou=Users,dc=[YOUR_DOMAIN_FROM_ENV]?uid?sub?(objectClass=*)"
#     AuthLDAPBindDN "cn=admin,dc=[YOUR_DOMAIN_FROM_ENV]"
#     AuthLDAPBindPassword "[COPY_FROM_ENV_FILE]"
#     LDAPReferrals Off
#     
#     # Restrict to specific user
#     Require ldap-user johndoe
#     
#     # Same performance settings
#     SVNCacheTextDeltas off
#     SVNCacheFullTexts off
#     SVNCacheRevProps off
#     SVNCacheNodeProps on
#     SVNBlockRead off
#     SVNAllowBulkUpdates prefer
#     LimitRequestBody 0
#     LimitXMLRequestBody 0
# </Location>

# ----------------------------------------
# Example: Project-Specific Repository Collection
# ----------------------------------------
# [OPTIONAL: Uncomment and modify for project collections]
# <Location /svn/projects/gamedev>
#     DAV svn
#     SVNParentPath /usr/local/apache2/svn/projects/gamedev
#     SVNListParentPath on
#     
#     # Same auth configuration
#     AuthType Basic
#     AuthName "Game Development Repositories"
#     AuthBasicProvider ldap
#     AuthLDAPURL "ldap://openldap:389/ou=Users,dc=[YOUR_DOMAIN_FROM_ENV]?uid?sub?(objectClass=*)"
#     AuthLDAPBindDN "cn=admin,dc=[YOUR_DOMAIN_FROM_ENV]"
#     AuthLDAPBindPassword "[COPY_FROM_ENV_FILE]"
#     LDAPReferrals Off
#     
#     # Restrict to group
#     Require ldap-group cn=gamedev,ou=Groups,dc=[YOUR_DOMAIN_FROM_ENV]
#     
#     # Same performance settings
#     SVNCacheTextDeltas off
#     SVNCacheFullTexts off
#     SVNCacheRevProps off
#     SVNCacheNodeProps on
#     SVNBlockRead off
#     SVNAllowBulkUpdates prefer
#     LimitRequestBody 0
#     LimitXMLRequestBody 0
# </Location>

# ============================================
# Repository Setup Instructions
# ============================================
# 1. Create SVN parent directory:
#    mkdir -p /usr/local/apache2/svn
#    chown -R daemon:daemon /usr/local/apache2/svn
#
# 2. Create a repository:
#    svnadmin create /usr/local/apache2/svn/myrepo
#    chown -R daemon:daemon /usr/local/apache2/svn/myrepo
#
# 3. Create user/project collections:
#    mkdir -p /usr/local/apache2/svn/users/john
#    mkdir -p /usr/local/apache2/svn/projects/web
#    svnadmin create /usr/local/apache2/svn/users/john/personal
#    chown -R daemon:daemon /usr/local/apache2/svn/users
#
# 4. Access repositories:
#    svn co http://yourserver/svn/myrepo
#    svn co http://yourserver/svn/users/john/personal

# ============================================
# SVN Client Configuration
# ============================================
# For optimal performance with large files:
#
# 1. Client-side: ~/.subversion/config
#    [global]
#    http-timeout = 3600
#    http-bulk-updates = yes
#    http-max-connections = 4
#
# 2. For large commits:
#    svn commit --config-option servers:global:http-timeout=7200

# ============================================
# Monitoring and Maintenance
# ============================================
# 1. Check repository size:
#    du -sh /usr/local/apache2/svn/*
#
# 2. Verify repository integrity:
#    svnadmin verify /usr/local/apache2/svn/myrepo
#
# 3. Monitor access logs:
#    tail -f logs/access_log | grep svn
#
# 4. Repository backup:
#    svnadmin dump /usr/local/apache2/svn/myrepo > backup.dump

# ============================================
# Troubleshooting
# ============================================
# 1. "403 Forbidden" - Check repository permissions:
#    ls -la /usr/local/apache2/svn/
#    chown -R daemon:daemon /usr/local/apache2/svn/
#
# 2. "Could not open repository" - Verify repository format:
#    svnadmin verify /usr/local/apache2/svn/myrepo
#
# 3. Timeout on large files - Increase client timeout:
#    svn --config-option servers:global:http-timeout=3600 co URL
#
# 4. Authentication failures - Test LDAP:
#    ldapsearch -x -H ldap://openldap:389 -D "cn=admin,dc=mstsage,dc=com"
#
# 5. Slow performance - Check cache settings and consider:
#    - Enabling SVNInMemoryCacheSize
#    - Running 'svnadmin pack' on repositories
#    - Using svnserve for read-heavy workloads
# ============================================