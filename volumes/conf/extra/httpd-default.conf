# ============================================
# Apache Default Settings Configuration
# ============================================
# This configuration file reflects default settings for Apache HTTP Server.
# You may change these, but chances are that you may not need to.

# ============================================
# Connection Timeout Settings
# ============================================

# Timeout: The number of seconds before receives and sends time out
# Default: 60 seconds
# Note: This may be overridden in httpd.conf for specific use cases
Timeout 60

# ============================================
# Keep-Alive Connection Settings
# ============================================
# Persistent connections allow multiple requests over a single TCP connection
# This improves performance by reducing connection overhead

# KeepAlive: Whether to allow persistent connections
# Set to "Off" to deactivate (not recommended)
KeepAlive On

# MaxKeepAliveRequests: Maximum requests per persistent connection
# Set to 0 for unlimited (not recommended)
# High values improve performance for clients making multiple requests
MaxKeepAliveRequests 100

# KeepAliveTimeout: Seconds to wait for next request on same connection
# Lower values free up connections faster for other clients
# Higher values benefit clients making multiple rapid requests
KeepAliveTimeout 5

# ============================================
# Server Identification Settings
# ============================================

# UseCanonicalName: How Apache constructs self-referencing URLs
# Off = Use hostname and port supplied by the client (default)
# On = Use the value of the ServerName directive
# DNS = Use reverse DNS lookup (not recommended)
UseCanonicalName Off

# AccessFileName: File to look for in each directory for additional config
# Default is .htaccess for compatibility
# Security note: Consider disabling with "AllowOverride None" in production
AccessFileName .htaccess

# ============================================
# Server Information Disclosure
# ============================================
# Control how much information Apache reveals about itself

# ServerTokens: Information in Server HTTP response header
# Prod[uctOnly] = "Apache" (most secure)
# Major = "Apache/2"
# Minor = "Apache/2.4"
# Min[imal] = "Apache/2.4.51"
# OS = "Apache/2.4.51 (Unix)"
# Full = "Apache/2.4.51 (Unix) OpenSSL/1.1.1" (least secure)
ServerTokens Full

# ServerSignature: Add server version to generated pages
# On = Show server version
# Off = Don't show version (more secure)
# EMail = Show version with ServerAdmin email link
ServerSignature Off

# ============================================
# DNS and Logging Settings
# ============================================

# HostnameLookups: Perform DNS lookups on client IP addresses
# Off = Log IP addresses only (recommended for performance)
# On = Log hostnames (causes DNS lookup for every request)
# Double = Perform double-reverse DNS lookup for security
HostnameLookups Off

# ============================================
# Request Timeout Settings
# ============================================
# Protection against slow client attacks (slowloris, etc.)

<IfModule reqtimeout_module>
  # RequestReadTimeout: Timeout for receiving request headers and body
  # header=20-40,MinRate=500:
  #   - Wait 20 seconds for first byte of headers
  #   - Extend timeout based on 500 bytes/sec rate
  #   - Maximum timeout of 40 seconds
  # body=20,MinRate=500:
  #   - Same as header but no upper limit
  # To disable: header=0 body=0
  RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# ============================================
# Default Settings Summary
# ============================================
# These defaults provide a good balance of:
# - Performance (keep-alive enabled, DNS lookups disabled)
# - Security (minimal server info disclosure)
# - Compatibility (.htaccess support)
# - Protection (request timeouts against slow attacks)
#
# Modify these values based on your specific needs:
# - High-traffic sites may need adjusted timeouts
# - Security-focused deployments should use ServerTokens Prod
# - Internal servers might benefit from HostnameLookups On
# ============================================