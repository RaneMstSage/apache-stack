# ============================================
# Apache WebDAV Configuration
# ============================================
# Distributed authoring and versioning (WebDAV)
# Enables web-based file management and collaboration
#
# Required modules: mod_alias, mod_auth_digest, mod_authn_core, mod_authn_file,
#                   mod_authz_core, mod_authz_user, mod_dav, mod_dav_fs,
#                   mod_setenvif

# ============================================
# WebDAV Lock Database
# ============================================
# Location for the DAV lock database
# The User/Group specified in httpd.conf needs write permissions on:
# 1. The directory where the DavLockDB is placed
# 2. Any directory where "Dav On" is specified
DavLockDB "/usr/local/apache2/var/DavLock"

# ============================================
# WebDAV Upload Directory Configuration
# ============================================
# Example configuration for DAV write access to an "uploads" directory
# This creates a web-accessible upload area with authentication

# Create alias for the uploads directory
Alias /uploads "/usr/local/apache2/uploads"

<Directory "/usr/local/apache2/uploads">
    # Enable WebDAV for this directory
    Dav On
    
    # ----------------------------------------
    # Authentication Configuration
    # ----------------------------------------
    # Use Digest authentication (more secure than Basic)
    AuthType Digest
    AuthName DAV-upload
    
    # Password file location
    # Create with: htdigest -c "/usr/local/apache2/user.passwd" DAV-upload admin
    AuthUserFile "/usr/local/apache2/user.passwd"
    AuthDigestProvider file
    
    # ----------------------------------------
    # Access Control
    # ----------------------------------------
    # Allow universal read-access, but restrict writes to admin user
    <RequireAny>
        # Anyone can read (GET), submit forms (POST), or check options
        Require method GET POST OPTIONS
        
        # Only admin user has full access (including write operations)
        Require user admin
    </RequireAny>
</Directory>

# ============================================
# WebDAV Client Compatibility Fixes
# ============================================
# The following directives disable redirects on non-GET requests for
# directories that don't include the trailing slash. This fixes problems
# with WebDAV clients that don't handle redirects properly.

# Microsoft clients
BrowserMatch "Microsoft Data Access Internet Publishing Provider" redirect-carefully
BrowserMatch "MS FrontPage" redirect-carefully

# File system clients
BrowserMatch "^WebDrive" redirect-carefully
BrowserMatch "^WebDAVFS/1\.[012]" redirect-carefully

# GNOME/Linux clients
BrowserMatch "^gnome-vfs/1\.0" redirect-carefully
BrowserMatch "^gvfs/1" redirect-carefully

# Development tools
BrowserMatch "^XML Spy" redirect-carefully
BrowserMatch "^Dreamweaver-WebDAV-SCM1" redirect-carefully

# KDE clients
BrowserMatch " Konqueror/4" redirect-carefully
BrowserMatch " Konqueror/5" redirect-carefully
BrowserMatch " dolphin/" redirect-carefully

# ============================================
# WebDAV Usage Notes
# ============================================
# 1. Ensure the uploads directory exists and has proper permissions:
#    mkdir -p /usr/local/apache2/uploads
#    chown daemon:daemon /usr/local/apache2/uploads
#
# 2. Create the lock database directory:
#    mkdir -p /usr/local/apache2/var
#    chown daemon:daemon /usr/local/apache2/var
#
# 3. Create user credentials:
#    htdigest -c "/usr/local/apache2/user.passwd" DAV-upload admin
#
# 4. WebDAV URL will be: http://yourserver/uploads/
#
# 5. For production use, consider:
#    - Using HTTPS for secure authentication
#    - Implementing more granular access controls
#    - Setting upload size limits
#    - Monitoring disk space usage
# ============================================