# ============================================
# Apache Git HTTP Backend Configuration
# ============================================
# This file configures Apache to serve Git repositories over HTTP/HTTPS
# using the Smart HTTP protocol
#
# Required modules: mod_env, mod_alias, mod_cgi/mod_cgid, mod_authz_core,
#                   mod_authn_core, mod_auth_basic, mod_authnz_ldap

# ============================================
# Git Environment Variables
# ============================================
# Set the root directory containing all Git repositories
SetEnv GIT_PROJECT_ROOT /usr/local/apache2/git

# Allow all repositories to be exported via HTTP
# Without this, you need a git-daemon-export-ok file in each repo
SetEnv GIT_HTTP_EXPORT_ALL

# Increase buffer size for large Git operations
# This helps with pushing/pulling large files or repos
SetEnv GIT_HTTP_MAX_REQUEST_BUFFER 100M

# ============================================
# Request Timeout Configuration
# ============================================
# Override global timeouts for Git operations
# Git operations can take longer than regular web requests
<IfModule reqtimeout_module>
    # Header timeout: 30-60 seconds with minimum rate of 500 bytes/sec
    # Body timeout: 3600 seconds (1 hour) with minimum rate of 1000 bytes/sec
    # [OPTIONAL: Increase for very large repos or slow connections]
    RequestReadTimeout header=30-60,MinRate=500 body=3600,MinRate=1000
</IfModule>

# ============================================
# Git HTTP Backend Script Mapping
# ============================================
# Map /git/ URLs to the Git HTTP backend CGI script
# This enables Smart HTTP protocol for efficient transfers
ScriptAlias /git/ /usr/local/apache2/cgi-bin/git-http-backend/

# ============================================
# Git LFS (Large File Storage) Configuration
# ============================================
# Configure Git LFS endpoints for large file handling
# LFS uses HTTPS even when Git operations use SSH

# LFS Info endpoint - handles LFS capability negotiation
<LocationMatch "^/git/.*\.git/info/lfs$">
    SetEnv no-gzip 1

    # Pass protocol information for HTTPS proxy
    <If "%{HTTP:X-Forwarded-Proto} == 'https'">
        SetEnv HTTPS on
        SetEnv SSL_PROTOCOL_VERSION TLSv1.2
    </If>

    # Require authentication for LFS info
    Require valid-user

    # Set proper content type for LFS responses
    Header always set "Content-Type" "application/vnd.git-lfs+json"
</LocationMatch>

# LFS Objects Batch endpoint - handles upload/download requests
<LocationMatch "^/git/.*\.git/info/lfs/objects/batch$">
    SetEnv no-gzip 1

    # Pass protocol information for HTTPS proxy
    <If "%{HTTP:X-Forwarded-Proto} == 'https'">
        SetEnv HTTPS on
        SetEnv SSL_PROTOCOL_VERSION TLSv1.2
    </If>

    # Require authentication for LFS batch operations
    Require valid-user

    # Set proper headers for LFS batch API
    Header always set "Content-Type" "application/vnd.git-lfs+json"
    Header always set "Access-Control-Allow-Origin" "*"
    Header always set "Access-Control-Allow-Methods" "GET, POST, PUT, OPTIONS"
    Header always set "Access-Control-Allow-Headers" "Authorization, Content-Type, Accept"

    # Remove body size limits for LFS operations
    LimitRequestBody 0
</LocationMatch>

# LFS Objects Storage endpoint - handles actual file uploads/downloads
<LocationMatch "^/git/.*\.git/info/lfs/objects/[a-f0-9]+$">
    SetEnv no-gzip 1

    # Pass protocol information for HTTPS proxy
    <If "%{HTTP:X-Forwarded-Proto} == 'https'">
        SetEnv HTTPS on
        SetEnv SSL_PROTOCOL_VERSION TLSv1.2
    </If>

    # Require authentication for LFS object access
    Require valid-user

    # Set proper headers for binary content
    Header always set "Access-Control-Allow-Origin" "*"
    Header always set "Access-Control-Allow-Methods" "GET, PUT, OPTIONS"
    Header always set "Access-Control-Allow-Headers" "Authorization, Content-Type"

    # Remove body size limits for large file uploads
    LimitRequestBody 0
</LocationMatch>

# ============================================
# CGI Directory Configuration
# ============================================
# Configure the CGI directory for Git operations
<Directory "/usr/local/apache2/cgi-bin">
    # Allow CGI script execution
    Options +ExecCGI

    # Grant access to all (auth handled at Location level)
    Require all granted

    # Set CGI handler for non-Windows systems
    # Git HTTP backend is a CGI script
    AddHandler cgi-script .cgi
    
    # SSL environment variables for secure operations
    # Exports SSL certificate data to CGI scripts
    SSLOptions +StdEnvVars +ExportCertData
</Directory>

# ============================================
# Main Git Location Configuration
# ============================================
# Configure authentication and access control for Git repositories
<Location /git>
    # Disable compression for better performance with binary files
    # Git already compresses objects internally
    SetEnv no-gzip 1

    # Pass protocol information to Git when behind HTTPS proxy
    <If "%{HTTP:X-Forwarded-Proto} == 'https'">
        SetEnv HTTPS on
        SetEnv SSL_PROTOCOL_VERSION TLSv1.2
    </If>

    # ----------------------------------------
    # Authentication Configuration
    # ----------------------------------------
    # [CHOOSE ONE: LDAP, Local File, or No Auth]
    
    # Option 1: LDAP Authentication (Recommended for enterprise)
    AuthType Basic
    AuthName "Git Repository"
    AuthBasicProvider ldap

    # LDAP connection settings
    # [CHANGE: Update domain to match LDAP_DOMAIN in .env file]
    # Format: ldap://host:port/basedn?attribute?scope?filter
    AuthLDAPURL "ldap://openldap:389/ou=Users,dc=[YOUR_DOMAIN_FROM_ENV]?uid?sub?(objectClass=*)"
    
    # Example: If LDAP_DOMAIN="mstsage.com" then use dc=mstsage,dc=com

    # LDAP bind credentials (for searching)
    # [CHANGE: Update domain to match LDAP_DOMAIN in .env file]
    AuthLDAPBindDN "cn=admin,dc=[YOUR_DOMAIN_FROM_ENV]"
    AuthLDAPBindPassword "[COPY_FROM_ENV_FILE]"
    
    # Copy LDAP_ADMIN_PASSWORD value from your .env file
    # Example: If LDAP_DOMAIN="mstsage.com" then use dc=mstsage,dc=com
    
    # Note: To convert LDAP_DOMAIN to dc format:
    # "example.com" becomes "dc=example,dc=com"
    # "sub.example.com" becomes "dc=sub,dc=example,dc=com"
    
    # LDAP connection settings
    LDAPReferrals Off
    
    # Option 2: File-based Authentication (for small teams)
    # [UNCOMMENT AND CONFIGURE if not using LDAP]
    # AuthType Basic
    # AuthName "Git Repository"
    # AuthBasicProvider file
    # AuthUserFile "/usr/local/apache2/conf/.htpasswd"
    
    # Option 3: No Authentication (public repos only)
    # [UNCOMMENT for public access - NOT RECOMMENDED]
    # Require all granted
    
    # Default: Require authenticated users
    Require valid-user
    
    # Remove any request body size limits
    # Allows pushing large files and repositories
    LimitRequestBody 0
</Location>

# ============================================
# Git Upload Pack (Clone/Fetch) Configuration
# ============================================
# Specific settings for read operations
<LocationMatch "^/git/.*/git-upload-pack$">
    # Optional: Allow anonymous read access
    # [UNCOMMENT for public clones]
    # Require all granted
</LocationMatch>

# ============================================
# Git Receive Pack (Push) Configuration  
# ============================================
# Specific settings for write operations
<LocationMatch "^/git/.*/git-receive-pack$">
    # Push operations always require authentication
    # Inherits settings from parent Location /git
</LocationMatch>

