# ============================================
# Repository Setup Instructions
# ============================================
# 1. Create Git repository directory:
#    mkdir -p /usr/local/apache2/git
#    chown -R daemon:daemon /usr/local/apache2/git
#
# 2. Initialize bare repositories:
#    cd /usr/local/apache2/git
#    git init --bare myrepo.git
#    cd myrepo.git
#    git config http.receivepack true
#    cd ..
#    chown -R daemon:daemon myrepo.git
#
# 3. Clone via HTTP:
#    git clone http://[YOUR_SERVER]/git/myrepo.git

# ============================================
# Performance Optimization Notes
# ============================================
# 1. Git uses its own compression, so disable Apache compression
# 2. Large binary files should use Git LFS when possible
# 3. Consider enabling HTTP/2 for better multiplexing
# 4. Monitor timeout settings - adjust based on repository sizes
# 5. Use 'git gc' regularly on server-side repositories
# 6. For large repos, consider increasing:
#    - Timeout values
#    - GIT_HTTP_MAX_REQUEST_BUFFER
#    - Client-side http.postBuffer

# ============================================
# Troubleshooting Notes
# ============================================
# Common issues and solutions:
# 
# 1. "403 Forbidden" - Check Git repository permissions
#    ls -la /usr/local/apache2/git
#    Ensure Apache user (daemon) can read repositories
#
# 2. "500 Internal Server Error" - Check git-http-backend
#    which git-http-backend
#    Verify CGI script exists and is executable
#
# 3. Timeout errors - Increase timeout values
#    Check both Apache and Nginx (if used) proxy timeouts
#
# 4. Authentication failures - Verify LDAP connectivity
#    Check Apache error log: tail -f logs/error_log
#    Test LDAP: ldapsearch -x -H ldap://openldap:389
#
# 5. Push failures - Ensure http.receivepack is enabled
#    cd [repo].git && git config http.receivepack true
# ============================================