# ============================================
# Apache Proxy HTML Module Configuration
# ============================================
# Configuration for mod_proxy_html which rewrites HTML links when
# Apache acts as a reverse proxy. This ensures internal URLs are
# properly rewritten to external URLs.
#
# NOTE: In your setup with Nginx as reverse proxy and Apache as
# backend, you probably DON'T need this module. This is for when
# Apache itself acts as the reverse proxy.
#
# Documentation:
# http://httpd.apache.org/docs/2.4/mod/mod_proxy_html.html
# http://httpd.apache.org/docs/2.4/mod/mod_xml2enc.html

# ============================================
# Module Loading (Platform Specific)
# ============================================
# First load the required libraries and modules
# mod_xml2enc handles character encoding conversions

# ----------------------------------------
# Unix/Linux Systems
# ----------------------------------------
# [UNCOMMENT if using Apache as reverse proxy on Unix/Linux]
# LoadFile /usr/lib/libxml2.so
# LoadModule proxy_html_module modules/mod_proxy_html.so
# LoadModule xml2enc_module modules/mod_xml2enc.so

# ----------------------------------------
# Windows Systems
# ----------------------------------------
# [UNCOMMENT if using Apache as reverse proxy on Windows]
# LoadFile C:/Apache24/bin/zlib.dll
# LoadFile C:/Apache24/bin/iconv.dll
# LoadFile C:/Apache24/bin/libxml2.dll
# LoadModule proxy_html_module modules/mod_proxy_html.so
# LoadModule xml2enc_module modules/mod_xml2enc.so

# ============================================
# HTML Link Declarations
# ============================================
# Define which HTML elements and attributes contain URLs
# that need to be rewritten when proxying

# ----------------------------------------
# W3C HTML 4.01 and XHTML 1.0 Standard Links
# ----------------------------------------
ProxyHTMLLinks  a               href
ProxyHTMLLinks  area            href
ProxyHTMLLinks  link            href
ProxyHTMLLinks  img             src longdesc usemap
ProxyHTMLLinks  object          classid codebase data usemap
ProxyHTMLLinks  q               cite
ProxyHTMLLinks  blockquote      cite
ProxyHTMLLinks  ins             cite
ProxyHTMLLinks  del             cite
ProxyHTMLLinks  form            action
ProxyHTMLLinks  input           src usemap
ProxyHTMLLinks  head            profile
ProxyHTMLLinks  base            href
ProxyHTMLLinks  script          src for

# ----------------------------------------
# JavaScript Event Handlers
# ----------------------------------------
# To support scripting events (requires ProxyHTMLExtended On)
ProxyHTMLEvents onclick ondblclick onmousedown onmouseup \
                onmouseover onmousemove onmouseout onkeypress \
                onkeydown onkeyup onfocus onblur onload \
                onunload onsubmit onreset onselect onchange

# ----------------------------------------
# Legacy HTML Support
# ----------------------------------------
# [UNCOMMENT for pre-1998 "transitional" HTML/XHTML support]
# ProxyHTMLLinks  frame          src longdesc
# ProxyHTMLLinks  iframe         src longdesc
# ProxyHTMLLinks  body           background
# ProxyHTMLLinks  applet         codebase

# ----------------------------------------
# Custom/Proprietary HTML Elements
# ----------------------------------------
# [ADD your own custom URL attributes as needed]
# ProxyHTMLLinks  myelement      myattr otherattr
# ProxyHTMLLinks  customtag      customattr

# ============================================
# Example Reverse Proxy Configuration
# ============================================
# This example shows how to use Apache (not Nginx) as a reverse proxy
# to an internal application server

# [EXAMPLE: Proxy internal app to external URL]
# # Disable forward proxy (important for security)
# ProxyRequests Off
#
# # Map external path to internal server
# ProxyPass /my-gateway/ http://internal.app.local:8080/
# ProxyPassReverse /my-gateway/ http://internal.app.local:8080/
#
# # Configure HTML link rewriting
# <Location /my-gateway/>
#     # Enable HTML parsing and link rewriting
#     ProxyHTMLEnable On
#     
#     # Rewrite URLs in HTML content
#     ProxyHTMLURLMap http://internal.app.local:8080/ /my-gateway/
#     ProxyHTMLURLMap / /my-gateway/
#     
#     # Optional: Set document type
#     # ProxyHTMLDocType "<!DOCTYPE html>"
#     
#     # Optional: Handle extended parsing
#     # ProxyHTMLExtended On
# </Location>

# ============================================
# Common Use Cases
# ============================================

# ----------------------------------------
# Case 1: Simple Internal Web App
# ----------------------------------------
# ProxyPass /app/ http://192.168.1.100:8080/
# <Location /app/>
#     ProxyPassReverse /
#     ProxyHTMLEnable On
#     ProxyHTMLURLMap http://192.168.1.100:8080/ /app/
#     ProxyHTMLURLMap / /app/
# </Location>

# ----------------------------------------
# Case 2: Multiple Backend Servers
# ----------------------------------------
# # App Server 1
# ProxyPass /app1/ http://backend1.local/
# <Location /app1/>
#     ProxyPassReverse /
#     ProxyHTMLEnable On
#     ProxyHTMLURLMap http://backend1.local/ /app1/
# </Location>
#
# # App Server 2
# ProxyPass /app2/ http://backend2.local/
# <Location /app2/>
#     ProxyPassReverse /
#     ProxyHTMLEnable On
#     ProxyHTMLURLMap http://backend2.local/ /app2/
# </Location>

# ============================================
# Performance Considerations
# ============================================
# 1. HTML parsing adds overhead - only use when necessary
# 2. Consider caching parsed content with mod_cache
# 3. For APIs returning JSON/XML, disable ProxyHTMLEnable
# 4. Use specific Location blocks, not server-wide

# ============================================
# Your Architecture Note
# ============================================
# In your current setup:
# - Nginx acts as the reverse proxy (handles external requests)
# - Apache is the backend server (serves content)
# - You DON'T need mod_proxy_html unless Apache itself
#   needs to proxy to other internal services
#
# Nginx handles:
# - SSL termination
# - Load balancing to Apache instances
# - Static file serving (optionally)
# - URL rewriting at the proxy level

# ============================================
# When You WOULD Need This
# ============================================
# You would need mod_proxy_html if:
# 1. Apache needs to proxy to other internal apps
# 2. You're replacing Nginx with Apache as reverse proxy
# 3. Apache needs to forward requests to microservices
# 4. You have legacy apps that Apache needs to proxy

# ============================================
# Troubleshooting
# ============================================
# 1. Check if modules are loaded:
#    httpd -M | grep proxy_html
#
# 2. Test HTML rewriting:
#    curl -H "Host: yourdomain" http://localhost/proxied-app/
#
# 3. Common issues:
#    - Missing libxml2: Install libxml2-dev package
#    - Broken links: Check ProxyHTMLURLMap patterns
#    - JavaScript issues: Enable ProxyHTMLExtended
#    - Encoding problems: Ensure mod_xml2enc is loaded
# ============================================