# Python WSGI Configuration
LoadModule wsgi_module modules/mod_wsgi.so

<IfModule wsgi_module>
    # Point to the virtual environment instead of system Python
    WSGIPythonHome /usr/local/apache2/python-env
    WSGIPythonPath /usr/local/apache2/python-apps
    
    # Set daemon processes for isolation and better performance
    WSGIDaemonProcess python-apps processes=2 threads=15 display-name=%{GROUP}
    WSGIProcessGroup python-apps
    
    # Basic configuration for main WSGI application
    WSGIScriptAlias /python /usr/local/apache2/python-apps/app.wsgi
    
    # Directory permissions for Python applications
    <Directory /usr/local/apache2/python-apps>
        Options ExecCGI
        Require all granted
        
        # Allow .htaccess files if needed
        AllowOverride FileInfo
        
        # Set handler for WSGI scripts
        <Files "*.wsgi">
            SetHandler wsgi-script
        </Files>
    </Directory>
    
    # Configuration for a sample application (uncomment and adjust as needed)
    # WSGIScriptAlias /myapp /usr/local/apache2/python-apps/myapp/app.wsgi
    # <Directory /usr/local/apache2/python-apps/myapp>
    #     Require all granted
    # </Directory>
    
    # Enable WSGI pass authorization (needed for some authentication scenarios)
    WSGIPassAuthorization On
    
    # Log level for WSGI module (uncomment for debugging)
    # LogLevel info ssl:warn wsgi:debug
</IfModule>