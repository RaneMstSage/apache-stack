# ============================================
# Apache Python WSGI Configuration
# ============================================
# Configures Apache to run Python web applications using mod_wsgi
# WSGI (Web Server Gateway Interface) is the standard for Python web apps
#
# Required module: mod_wsgi

# Load the WSGI module
LoadModule wsgi_module modules/mod_wsgi.so

<IfModule wsgi_module>
    # ============================================
    # Python Environment Configuration
    # ============================================
    # Point to the virtual environment instead of system Python
    # This ensures all Python apps use the same dependencies
    WSGIPythonHome /usr/local/apache2/python-env
    
    # Add Python application directory to Python path
    # All modules in this directory will be importable
    WSGIPythonPath /usr/local/apache2/python-apps
    
    # ============================================
    # WSGI Daemon Process Configuration
    # ============================================
    # Run Python apps in separate daemon processes for:
    # - Better isolation from Apache processes
    # - Ability to reload without restarting Apache
    # - Better resource management
    
    # Create daemon process group
    # processes=2: Run 2 Python processes
    # threads=15: Each process handles 15 threads
    # display-name: Shows in process list as (wsgi:python-apps)
    WSGIDaemonProcess python-apps processes=2 threads=15 display-name=%{GROUP}
    
    # Assign requests to the daemon process group
    WSGIProcessGroup python-apps
    
    # [OPTIONAL: Per-application daemon processes]
    # WSGIDaemonProcess app1 processes=1 threads=10 python-path=/usr/local/apache2/app1
    # WSGIDaemonProcess app2 processes=1 threads=10 python-path=/usr/local/apache2/app2
    
    # ============================================
    # Main WSGI Application Mapping
    # ============================================
    # Map /python URL to the main WSGI application
    # Access at: http://yourserver/python
    WSGIScriptAlias /python /usr/local/apache2/python-apps/app.wsgi
    
    # ============================================
    # Python Application Directory Configuration
    # ============================================
    <Directory /usr/local/apache2/python-apps>
        # Allow CGI execution for WSGI scripts
        Options ExecCGI
        
        # Grant access to all users
        # [CHANGE: Add authentication if needed]
        Require all granted
        
        # Allow .htaccess files for directory-specific settings
        # FileInfo: Allows document type and handler overrides
        AllowOverride FileInfo
        
        # Set WSGI handler for .wsgi files
        <Files "*.wsgi">
            SetHandler wsgi-script
        </Files>
        
        # [OPTIONAL: Add Python file handling]
        # <Files "*.py">
        #     Deny from all
        # </Files>
    </Directory>
    
    # ============================================
    # Additional Application Mappings
    # ============================================
    # [EXAMPLES: Uncomment and modify as needed]
    
    # Flask/Django application
    # WSGIScriptAlias /myapp /usr/local/apache2/python-apps/myapp/app.wsgi
    # <Directory /usr/local/apache2/python-apps/myapp>
    #     Require all granted
    #     # For Django, you might need:
    #     # WSGIProcessGroup myapp
    #     # WSGIApplicationGroup %{GLOBAL}
    # </Directory>
    
    # API endpoint with custom settings
    # WSGIScriptAlias /api /usr/local/apache2/python-apps/api/api.wsgi
    # <Directory /usr/local/apache2/python-apps/api>
    #     Require all granted
    #     # Custom timeout for long-running API calls
    #     WSGICallableObject application
    #     WSGIScriptReloading On
    # </Directory>
    
    # Static files for Python apps (CSS, JS, images)
    # Alias /static /usr/local/apache2/python-apps/static
    # <Directory /usr/local/apache2/python-apps/static>
    #     Require all granted
    #     # Cache static files
    #     Header set Cache-Control "public, max-age=3600"
    # </Directory>
    
    # ============================================
    # WSGI Security and Authentication
    # ============================================
    # Pass HTTP Authorization header to WSGI apps
    # Required for token-based authentication (JWT, OAuth)
    WSGIPassAuthorization On
    
    # [OPTIONAL: Restrict WSGI apps by IP]
    # <Directory /usr/local/apache2/python-apps>
    #     Require ip 192.168.1.0/24
    # </Directory>
    
    # ============================================
    # Performance Tuning Options
    # ============================================
    # [OPTIONAL: Uncomment for production tuning]
    
    # Lazy loading of Python apps (faster Apache startup)
    # WSGILazyInitialization On
    
    # Restrict embedded mode (recommended for production)
    # WSGIRestrictEmbedded On
    
    # Script reloading (disable in production)
    # WSGIScriptReloading Off
    
    # Maximum request size (default unlimited)
    # LimitRequestBody 10485760  # 10MB
    
    # ============================================
    # Logging Configuration
    # ============================================
    # Control WSGI module logging
    
    # [UNCOMMENT for debugging]
    # LogLevel info ssl:warn wsgi:trace3
    
    # Log levels for mod_wsgi:
    # - wsgi:error   - Only errors
    # - wsgi:warn    - Warnings and errors
    # - wsgi:info    - General information
    # - wsgi:debug   - Detailed debugging
    # - wsgi:trace1-8 - Very detailed trace
    
    # ============================================
    # Sample WSGI Application Files
    # ============================================
    # 1. Basic app.wsgi:
    #    def application(environ, start_response):
    #        status = '200 OK'
    #        response_headers = [('Content-type', 'text/plain')]
    #        start_response(status, response_headers)
    #        return [b'Hello from Python WSGI!']
    #
    # 2. Flask app.wsgi:
    #    import sys
    #    sys.path.insert(0, '/usr/local/apache2/python-apps')
    #    from myapp import app as application
    #
    # 3. Django app.wsgi:
    #    import os
    #    import sys
    #    sys.path.append('/usr/local/apache2/python-apps/myproject')
    #    os.environ['DJANGO_SETTINGS_MODULE'] = 'myproject.settings'
    #    from django.core.wsgi import get_wsgi_application
    #    application = get_wsgi_application()
</IfModule>

# ============================================
# Virtual Environment Setup
# ============================================
# To create the Python virtual environment:
# 1. docker exec apache1 python3 -m venv /usr/local/apache2/python-env
# 2. docker exec apache1 /usr/local/apache2/python-env/bin/pip install flask django
# 3. Set ownership: docker exec apache1 chown -R daemon:daemon /usr/local/apache2/python-env

# ============================================
# Docker-Specific Notes
# ============================================
# 1. The python-apps directory is mounted as a volume
# 2. Virtual environment should be inside the container (not mounted)
# 3. Install Python packages in the Dockerfile or at runtime
# 4. File permissions must allow Apache (daemon) to read Python files

# ============================================
# Troubleshooting Python WSGI
# ============================================
# 1. Check if mod_wsgi is loaded:
#    docker exec apache1 httpd -M | grep wsgi
#
# 2. Test WSGI configuration:
#    docker exec apache1 mod_wsgi-express check-config
#
# 3. Common errors:
#    - "ImportError": Check WSGIPythonPath and sys.path
#    - "Permission denied": Fix file ownership (chown daemon:daemon)
#    - "Timeout": Increase timeout values or optimize code
#    - "Cannot load module": Install in virtual environment
#
# 4. Debug with simple WSGI app first before complex frameworks
# ============================================