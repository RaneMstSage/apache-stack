# ============================================
# Apache PHP-FPM Configuration
# ============================================
# Configures Apache to use PHP-FPM (FastCGI Process Manager)
# for processing PHP files. PHP-FPM runs in a separate container.
#
# Required modules: mod_proxy, mod_proxy_fcgi, mod_dir, mod_env

# ============================================
# PHP Handler Configuration
# ============================================
# Route all PHP files to the PHP-FPM container
# The php:9000 refers to the 'php' container on port 9000
<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# ============================================
# Alternative PHP Handler Patterns (Optional)
# ============================================
# [UNCOMMENT if you need different handling for specific cases]

# Handle PHP files in specific directories only
# <Directory "/usr/local/apache2/htdocs/app">
#     <FilesMatch \.php$>
#         SetHandler "proxy:fcgi://php:9000"
#     </FilesMatch>
# </Directory>

# Handle additional PHP extensions
# <FilesMatch "\.(php|phtml|php3|php4|php5|php7|phps)$">
#     SetHandler "proxy:fcgi://php:9000"
# </FilesMatch>

# ============================================
# Directory Index Configuration
# ============================================
# Set default files to serve when accessing a directory
<IfModule dir_module>
    # Prioritize index.php over index.html
    DirectoryIndex index.php index.html index.htm
</IfModule>

# ============================================
# PHP MIME Type Configuration
# ============================================
# Define MIME types for PHP files
AddType application/x-httpd-php .php
AddType application/x-httpd-php-source .phps

# Additional PHP-related MIME types
# AddType application/x-httpd-php .phtml
# AddType application/x-httpd-php .php3
# AddType application/x-httpd-php .php4
# AddType application/x-httpd-php .php5
# AddType application/x-httpd-php .php7

# ============================================
# PHP Configuration via Environment
# ============================================
# Pass PHP settings through Apache environment variables
<IfModule env_module>
    # File upload limits
    SetEnv PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M"
    
    # [OPTIONAL: Add more PHP settings as needed]
    # Memory limit
    # SetEnv PHP_VALUE "memory_limit=256M"
    
    # Execution time
    # SetEnv PHP_VALUE "max_execution_time=300"
    
    # Error reporting (development)
    # SetEnv PHP_VALUE "display_errors=1 \n error_reporting=E_ALL"
    
    # Session settings
    # SetEnv PHP_VALUE "session.save_path=/tmp \n session.gc_maxlifetime=1440"
</IfModule>

# ============================================
# PHP-FPM Connection Pool Settings
# ============================================
# Configure connection pooling to PHP-FPM

# Enable connection reuse
<Proxy "fcgi://php:9000">
    # Keep connections alive to PHP-FPM
    ProxySet enablereuse=on
    
    # Maximum connections to PHP-FPM
    # ProxySet max=20
    
    # Connection timeout (seconds)
    # ProxySet timeout=60
    
    # Retry timeout after failure
    # ProxySet retry=0
</Proxy>

# ============================================
# PHP Security Headers
# ============================================
# Add security headers for PHP responses
<FilesMatch \.php$>
    # Prevent content type sniffing
    Header set X-Content-Type-Options "nosniff"
    
    # Prevent clickjacking
    Header set X-Frame-Options "SAMEORIGIN"
    
    # Enable XSS protection
    Header set X-XSS-Protection "1; mode=block"
</FilesMatch>

# ============================================
# PHP Error Handling
# ============================================
# Custom error pages for PHP errors

# Handle PHP-FPM connection errors
# ProxyErrorOverride On
# ErrorDocument 503 /error/php-unavailable.html

# ============================================
# PHP Performance Optimization
# ============================================
# Cache PHP file existence checks (requires mod_cache)
# <FilesMatch \.php$>
#     # Cache file stat results
#     FileETag MTime Size
#     Header set Cache-Control "private, max-age=0"
# </FilesMatch>

# ============================================
# Development vs Production Settings
# ============================================
# Development settings (current)
# - Errors displayed
# - Lower memory limits
# - Shorter execution times

# For production, consider:
# - SetEnv PHP_VALUE "display_errors=0"
# - SetEnv PHP_VALUE "memory_limit=512M"
# - SetEnv PHP_VALUE "post_max_size=100M"
# - SetEnv PHP_VALUE "upload_max_filesize=100M"
# - Enable opcache settings

# ============================================
# Troubleshooting PHP-FPM
# ============================================
# 1. Test PHP-FPM connectivity:
#    docker exec apache1 curl -I php:9000
#
# 2. Check PHP-FPM status:
#    docker logs php-fpm
#
# 3. Verify PHP processing:
#    Create test.php with: <?php phpinfo(); ?>
#
# 4. Common errors:
#    - 503 Service Unavailable: PHP-FPM not running
#    - 504 Gateway Timeout: PHP script too slow
#    - No input file specified: Wrong document root

# ============================================
# Docker-Specific Notes
# ============================================
# - 'php' refers to the container name in docker-compose.yml
# - Port 9000 is the default PHP-FPM port
# - Both Apache and PHP must share the same document root
# - File permissions must allow PHP-FPM to read files
# ============================================