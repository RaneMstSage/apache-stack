# ============================================
# Apache Multi-Language Error Documents Configuration
# ============================================
# Implements error pages that automatically display in the user's
# preferred language through content negotiation
#
# Required modules: mod_alias, mod_authz_core, mod_authz_host,
#                   mod_include, mod_negotiation

# ============================================
# Error Document Directory Alias
# ============================================
# Maps /error/ URLs to the Apache error document directory
# These files use Server Side Includes (SSI) for dynamic content
Alias /error/ "/usr/local/apache2/error/"

# ============================================
# Custom Error Document Includes (Optional)
# ============================================
# To customize error messages without modifying default files,
# create your own include files and uncomment this alias:
#
# Alias /error/include/ "/usr/local/apache2/custom-error-includes/"
#
# Then copy files from /usr/local/apache2/error/include/ to your
# custom directory and modify as needed. Can be set per-VirtualHost.

# ============================================
# Error Document Directory Configuration
# ============================================
<Directory "/usr/local/apache2/error">
    # No .htaccess overrides in error directory
    AllowOverride None
    
    # Enable Server Side Includes (SSI) but disable exec
    # for security (no shell command execution)
    Options IncludesNoExec
    
    # Process .html files for SSI directives
    AddOutputFilter Includes html
    
    # Enable type-map handler for .var files
    # (used for language negotiation)
    AddHandler type-map var
    
    # Allow access to error pages for everyone
    Require all granted
    
    # ----------------------------------------
    # Language Priority
    # ----------------------------------------
    # Order of language preference when user's language isn't available
    # Listed roughly by usage/translation completeness
    LanguagePriority en cs de es fr it ja ko nl pl pt-br ro sv tr
    
    # Behavior when no exact language match:
    # Prefer: Use best match from LanguagePriority
    # Fallback: Use any available language
    ForceLanguagePriority Prefer Fallback
</Directory>

# ============================================
# Error Document Mappings
# ============================================
# Maps HTTP error codes to custom error pages
# .var files contain language negotiation maps

# ----------------------------------------
# 4xx Client Errors
# ----------------------------------------
# Bad Request - Malformed request syntax
ErrorDocument 400 /error/HTTP_BAD_REQUEST.html.var

# Unauthorized - Authentication required
ErrorDocument 401 /error/HTTP_UNAUTHORIZED.html.var

# Forbidden - Server refuses to fulfill request
ErrorDocument 403 /error/HTTP_FORBIDDEN.html.var

# Not Found - Requested resource doesn't exist
ErrorDocument 404 /error/HTTP_NOT_FOUND.html.var

# Method Not Allowed - Request method not supported
ErrorDocument 405 /error/HTTP_METHOD_NOT_ALLOWED.html.var

# Request Timeout - Client took too long
ErrorDocument 408 /error/HTTP_REQUEST_TIME_OUT.html.var

# Gone - Resource no longer available
ErrorDocument 410 /error/HTTP_GONE.html.var

# Length Required - Content-Length header missing
ErrorDocument 411 /error/HTTP_LENGTH_REQUIRED.html.var

# Precondition Failed - Request headers conditions not met
ErrorDocument 412 /error/HTTP_PRECONDITION_FAILED.html.var

# Request Entity Too Large - Upload exceeds limit
ErrorDocument 413 /error/HTTP_REQUEST_ENTITY_TOO_LARGE.html.var

# Request-URI Too Long - URL exceeds limit
ErrorDocument 414 /error/HTTP_REQUEST_URI_TOO_LARGE.html.var

# Unsupported Media Type - Server doesn't support file type
ErrorDocument 415 /error/HTTP_UNSUPPORTED_MEDIA_TYPE.html.var

# ----------------------------------------
# 5xx Server Errors
# ----------------------------------------
# Internal Server Error - Generic server error
ErrorDocument 500 /error/HTTP_INTERNAL_SERVER_ERROR.html.var

# Not Implemented - Server doesn't support functionality
ErrorDocument 501 /error/HTTP_NOT_IMPLEMENTED.html.var

# Bad Gateway - Invalid response from upstream server
ErrorDocument 502 /error/HTTP_BAD_GATEWAY.html.var

# Service Unavailable - Server temporarily overloaded
ErrorDocument 503 /error/HTTP_SERVICE_UNAVAILABLE.html.var

# Variant Also Negotiates - Circular reference in content negotiation
ErrorDocument 506 /error/HTTP_VARIANT_ALSO_VARIES.html.var

# ============================================
# Customization Guide
# ============================================
# 1. To create custom error pages:
#    - Copy /usr/local/apache2/error/ to your custom location
#    - Modify the .html.var files as needed
#    - Update the Alias directive
#
# 2. To add a simple custom 404:
#    ErrorDocument 404 /custom-404.html
#
# 3. To use a PHP script for errors:
#    ErrorDocument 404 /error-handler.php
#
# 4. To add more languages:
#    - Create new language sections in .var files
#    - Add language to LanguagePriority

# ============================================
# Important Notes
# ============================================
# 1. Error documents bypass normal authentication
# 2. Keep error pages small (under 512 bytes for IE compatibility)
# 3. Avoid external resources in error pages (CSS, JS, images)
# 4. Test with: curl -H "Accept-Language: de" http://yoursite/nonexistent
# 5. The .var files show server version - disable with ServerTokens Prod

# ============================================
# Load Balancer Considerations
# ============================================
# With Nginx in front:
# - Nginx may intercept some errors (502, 504)
# - Configure Nginx error_page directives to pass through
# - Or create matching error pages in Nginx
# ============================================