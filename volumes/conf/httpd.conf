# This is the main Apache HTTP server configuration file
# It contains the configuration directives that give the server its instructions

# ServerRoot: The top of the directory tree under which the server's
# configuration, error, and log files are kept
ServerRoot "/usr/local/apache2"

# This is the main Apache HTTP server configuration file
# It contains the configuration directives that give the server its instructions

# ServerRoot: The top of the directory tree under which the server's
# configuration, error, and log files are kept
Listen 80

# ============================================
# Dynamic Shared Object (DSO) Support
# ============================================
# These modules are loaded at runtime to extend Apache's functionality

# Authentication modules
# Core authentication functionality
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so

# Authorization modules
# Control access to resources
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so


# Compatibility and basic authentication
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule auth_digest_module modules/mod_auth_digest.so

# LDAP authentication support
# For centralized user authentication
LoadModule authnz_ldap_module modules/mod_authnz_ldap.so
LoadModule ldap_module modules/mod_ldap.so

# Request timeout module
# Prevents slow clients from holding connections
LoadModule reqtimeout_module modules/mod_reqtimeout.so

# Content filtering and MIME type handling
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so

# Logging functionality
LoadModule log_config_module modules/mod_log_config.so

# Environment variables and headers manipulation
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so

# Version module for version-dependent configuration
LoadModule version_module modules/mod_version.so

# Proxy modules for reverse proxy functionality
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_html_module modules/mod_proxy_html.so

# HTTP/2 support for better performance
LoadModule http2_module modules/mod_http2.so

# Unix-specific functionality
LoadModule unixd_module modules/mod_unixd.so

# Server status and directory listing
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule info_module modules/mod_info.so

# Directory handling and aliasing
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so

# URL rewriting and virtual host aliasing
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule vhost_alias_module modules/mod_vhost_alias.so

# XML encoding support
LoadModule xml2enc_module modules/mod_xml2enc.so

# Compression modules for bandwidth optimization
LoadModule brotli_module modules/mod_brotli.so
LoadModule deflate_module modules/mod_deflate.so

# Remote IP module for getting real client IPs behind proxies
LoadModule remoteip_module modules/mod_remoteip.so


# WebDAV, SVN and Git support modules
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule dav_svn_module modules/mod_dav_svn.so
LoadModule authz_svn_module modules/mod_authz_svn.so

# CGI module for executing scripts
LoadModule cgid_module modules/mod_cgid.so

# ============================================
# User and Group Settings
# ============================================
# The user and group that Apache runs as
<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

# ============================================
# Server Identity Settings
# ============================================
# Email address for server administrator
ServerAdmin webmaster@mstsage.com

# Hostname and port for the server
ServerName code.mstsage.com

# ============================================
# Directory Access Controls
# ============================================
# Default deny access to filesystem root
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Document root directory configuration
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    # Allow directory indexes and following symbolic links
    Options Indexes FollowSymLinks

    # Allow .htaccess files to override settings
    AllowOverride All

    # Grant access to all users
    Require all granted
</Directory>

# Deny access to .htaccess and .htpasswd files
<Files ".ht*">
    Require all denied
</Files>

# ============================================
# Logging Configuration
# ============================================
# Error log location
ErrorLog "logs/error_log"

# Log verbosity level
# Possible values: trace8...trace1, debug, info, notice, warn, error, crit, alert, emerg
LogLevel warn

# Log format definitions and access log
<IfModule log_config_module>
    # Combined log format includes referer and user agent
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

    # Common log format is more basic
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    # Extended format with I/O statistics
    <IfModule logio_module>
        LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    # Use combined format for access log
    CustomLog "logs/access_log" combined
</IfModule>

# ============================================
# CGI Configuration
# ============================================
# Map /cgi-bin/ URL path to CGI directory
<IfModule alias_module>
    ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
</IfModule>

# CGI directory permissions
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options ExecCGI
    Require all granted
</Directory>

# Security: Remove proxy header to prevent proxy abuse
<IfModule headers_module>
    RequestHeader unset Proxy early
</IfModule>

# ============================================
# MIME Type Configuration
# ============================================
<IfModule mime_module>
    # MIME types configuration file
    TypesConfig conf/mime.types

    # Additional MIME type mappings
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

# ============================================
# Timeout Settings
# ============================================
# Global timeout for all operations
# 600 seconds = 10 minutes - good balance for general web + repo operations
Timeout 600

# Keep-alive timeout between requests on persistent connections
KeepAliveTimeout 15

# Request timeout configuration with minimum data rates
<IfModule reqtimeout_module>
    # Default for regular web requests
    # Header: 20-40 seconds with 500 bytes/sec minimum
    # Body: 20 seconds with 500 bytes/sec minimum
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# ============================================
# Include Additional Configuration Files
# ============================================
# Multi-Processing Module configuration
Include conf/extra/httpd-mpm.conf

# SSL/TLS configuration
Include conf/extra/httpd-ssl.conf

# Compression settings
Include conf/extra/httpd-compression.conf

# PHP FastCGI configuration
Include conf/extra/httpd-php-fcgi.conf

# Subversion repository configuration
Include conf/extra/httpd-svn.conf

# Git repository configuration
Include conf/extra/httpd-git.conf

# Python application configuration
Include conf/extra/httpd-python.conf

# Lua scripting configuration
Include conf/extra/httpd-lua.conf

# Virtual hosts configuration
Include conf/extra/httpd-vhosts.conf

# WebDAV configuration
Include conf/extra/httpd-dav.conf

# Server status and info configuration
Include conf/extra/httpd-info.conf

# ============================================
# Header Modifications
# ============================================
<IfModule headers_module>
    # Fix for SVN clients behind HTTPS proxies
    # Rewrites https:// to http:// in Destination header for WebDAV operations
    RequestHeader edit Destination ^https http early
</IfModule>

# ============================================
# Protocol Settings
# ============================================
# Enable HTTP/1.1 only (not HTTP/2) for compatibility
# Note: H2Direct is on but HTTP/2 not in Protocols list
Protocols http/1.1

# Allow HTTP/2 direct mode (h2c - HTTP/2 cleartext)
H2Direct on