;;;;;;;;;;;;;;;;;;;;;;;
; PHP Core Settings   ;
;;;;;;;;;;;;;;;;;;;;;;;

; Basic PHP behavior
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On

; For production environments, we hide PHP version for security
expose_php = Off

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;

; Increased limits for handling larger requests and files
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error handling and logging ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Production error settings - log errors but don't display them
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
ignore_repeated_errors = Off
report_memleaks = On

; Hide arguments in stack traces for better security
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

;;;;;;;;;;;;;;;;;
; Data Handling ;
;;;;;;;;;;;;;;;;;

; Increased limits for file uploads
post_max_size = 128M
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

; File Uploads configuration
file_uploads = On
upload_max_filesize = 128M
max_file_uploads = 20

; Character encoding
default_charset = "UTF-8"

;;;;;;;;;;;;;;;;;;;;;;;;;
; Paths and Directories ;
;;;;;;;;;;;;;;;;;;;;;;;;;

; Security settings
enable_dl = Off
cgi.fix_pathinfo = 1

;;;;;;;;;;;;;;;;
; File Handling ;
;;;;;;;;;;;;;;;;

; Allow URL fopen, but disable URL includes for security
allow_url_fopen = On
allow_url_include = Off

;;;;;;;;;;;;;;;;;;;
; Module Settings ;
;;;;;;;;;;;;;;;;;;;

[Date]
date.timezone = UTC

[Session]
; Session settings for security and performance
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1440
session.gc_divisor = 1000
session.gc_probability = 1
session.sid_length = 26
session.sid_bits_per_character = 5
session.cache_limiter = nocache
session.cache_expire = 180

[opcache]
; Enable OPcache for better performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

[MySQL]
; MySQL connection settings
mysqli.allow_persistent = On
mysqli.max_persistent = -1
mysqli.max_links = -1
mysqli.default_port = 3306