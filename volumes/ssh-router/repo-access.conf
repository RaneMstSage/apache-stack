# Repository Access Control Configuration
# This file defines LDAP group requirements for Git and SVN repositories

# ============================================
# Default Access Requirements
# ============================================
[defaults.git]
read_groups=git-users,admins
write_groups=git-users,admins

[defaults.svn]
read_groups=svn-users,admins
write_groups=svn-users,admins

# ============================================
# Git Repository Access Control
# ============================================

# Infrastructure projects
[git.apache-stack]
groups=proj-infrastructure,admins

[git.openwebui-pipelines]
groups=proj-infrastructure,admins

[git.openwebui-stack]
groups=proj-infrastructure,admins

# MstSage Tools
[git.sage-repo-viewer]
groups=proj-mstsage-tools,admins

[git.sage_checkout_plugin]
groups=proj-mstsage-tools,admins

[git.SageDark]
groups=proj-mstsage-tools,admins

[git.sagemine_ssh_keys]
groups=proj-mstsage-tools,admins

# Educational projects
[git.Archmage]
